<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="cp-api-base" content="https://api.chess-publisher.org">
  <meta name="google-client-id" content="">
  <title>Chess-Publisher Web | Sign In</title>
  <link rel="stylesheet" href="./login.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./login.mjs" type="module"></script>
</head>
<body>
  <main>
    <p><a href="/">Chess-Publisher</a></p>
    <h1>Chess-Publisher Web</h1>
    <p>Manage tournaments, players, pairings, results, and standings in the Chess-Publisher organizer workspace.</p>

    <section id="google-auth-section" aria-label="Sign in with Google">
      <div id="google-signin-button"></div>
      <p role="status" id="google-status"></p>
    </section>

    <section id="signed-in-panel" hidden aria-label="Your account">
      <div class="signed-in-header">
        <img id="signed-in-avatar" alt="" hidden referrerpolicy="no-referrer">
        <div>
          <strong id="signed-in-name"></strong>
          <div id="signed-in-email" class="muted"></div>
        </div>
      </div>
      <div class="signed-in-actions">
        <button type="button" id="open-workspace-btn">Open Workspace</button>
        <a id="open-arbiter-btn" class="secondary-link" href="https://web.chess-publisher.org/" target="_blank" rel="noopener noreferrer">Arbiter Companion</a>
        <button type="button" id="account-logout-btn" class="secondary">Sign Out</button>
      </div>
      <p role="status" id="account-status" hidden></p>
      <div class="my-tournaments-box">
        <h2>My Tournaments</h2>
        <ul id="login-tournaments-list"></ul>
      </div>
    </section>

    <details id="legacy-token-details">
      <summary>Sign in with an Organizer Token</summary>
      <form>
        <label for="organizer-token">Organizer Token</label>
        <input id="organizer-token" type="password" maxlength="2048" autocomplete="off" required>
        <button type="submit">Open Workspace</button>
        <p role="status" id="login-status"></p>
      </form>
    </details>
  </main>
</body>
</html>
