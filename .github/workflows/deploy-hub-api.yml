name: Deploy Tournament Hub API

on:
  push:
    branches:
      - main
    paths:
      - 'workers/hub-api/organizer-write-routes.patch'
      - '.github/workflows/deploy-hub-api.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUB_WORKER_NAME: chess-publisher-hub-api-beta
  HUB_PUBLIC_BASE: https://chess-publisher-hub-api-beta.kyamranbilyal.workers.dev
  BASELINE_SHA256: b1f455b94a63b4715ae7ade2c71317c6a5ba5475d1f98e97b2e0d6a6de0ed346
  PATCHED_SHA256: f5cdcd77812898a6ac04ed3659ba776684159534a663398fea2279257fcf0679

jobs:
  deploy:
    name: Ensure organizer-owned Hub routes are live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Inspect current Hub content and active deployment
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hub-api-deploy"
          mkdir -p "$work"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl --fail --silent --show-error --location -H "$auth" "$api" -o "$work/live-worker.multipart"
          curl --fail --silent --show-error -H "$auth" "$api/deployments" -o "$work/deployments-before.json"

          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib, json, os

          work = Path(os.environ['RUNNER_TEMP']) / 'hub-api-deploy'
          raw = (work / 'live-worker.multipart').read_bytes()
          first = raw.splitlines()[0].decode('ascii', 'strict')
          if not first.startswith('--'):
              raise SystemExit('Unexpected Hub Worker download format.')
          boundary = first[2:]
          envelope = (
              f'Content-Type: multipart/form-data; boundary={boundary}\r\n'
              'MIME-Version: 1.0\r\n\r\n'
          ).encode() + raw
          msg = BytesParser(policy=default).parsebytes(envelope)
          parts = list(msg.iter_parts())
          if len(parts) != 1:
              raise SystemExit(f'Expected one Worker module, got {len(parts)}.')
          payload = parts[0].get_payload(decode=True) or b''
          if b'export default' not in payload:
              raise SystemExit('Recovered module is not the expected Hub Worker source.')
          (work / 'worker.original.js').write_bytes(payload)
          (work / 'worker.js').write_bytes(payload)

          sha = hashlib.sha256(payload).hexdigest()
          if sha == os.environ['BASELINE_SHA256']:
              source_state = 'baseline'
          elif sha == os.environ['PATCHED_SHA256']:
              source_state = 'patched'
          else:
              raise SystemExit(f'Refusing unknown Hub Worker content SHA256: {sha}')

          deployments = json.loads((work / 'deployments-before.json').read_text())
          rows = (deployments.get('result') or {}).get('deployments') or []
          if not rows:
              raise SystemExit('No active Hub deployment was returned by Cloudflare.')
          versions = rows[0].get('versions') or []
          if len(versions) != 1 or float(versions[0].get('percentage') or 0) != 100:
              raise SystemExit('Expected one 100% active Hub Worker version.')
          previous_version = str(versions[0].get('version_id') or '')
          if not previous_version:
              raise SystemExit('Active Hub deployment has no version id.')

          print(f'Current Hub content SHA256: {sha}')
          print(f'Current content state: {source_state}')
          print(f'Active deployment version: {previous_version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'source_state={source_state}\n')
              out.write(f'previous_version_id={previous_version}\n')
          PY

      - name: Apply exact organizer-route patch when needed
        if: steps.inspect.outputs.source_state == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hub-api-deploy"
          patch --batch --forward -p0 < "$GITHUB_WORKSPACE/workers/hub-api/organizer-write-routes.patch"

      - name: Verify exact patched Worker source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hub-api-deploy"
          node --check worker.js
          test "$(sha256sum worker.js | awk '{print $1}')" = "$PATCHED_SHA256"
          grep -Fq '/api\/v1\/organizer\/tournaments\/([^/]+)\/snapshot' worker.js
          grep -Fq 'async function requireOrganizerTournamentOwner' worker.js
          grep -Fq 'authMode = "managed"' worker.js
          grep -Fq 'return requireManageToken(' worker.js

      - name: Upload patched content when needed
        id: upload
        if: steps.inspect.outputs.source_state == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hub-api-deploy"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}/content"
          status="$(curl --silent --show-error \
            --output "$work/content-update.json" \
            --write-out '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F "worker.js=@${work}/worker.js;type=application/javascript+module" \
            "$endpoint")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'hub-api-deploy' / 'content-update.json'
          try:
              data = json.loads(p.read_text())
              for err in data.get('errors') or []:
                  print(f"Cloudflare error {err.get('code')}: {err.get('message')}")
          except Exception:
              print('Cloudflare content update failed with a non-JSON response.')
          PY
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Wait for live organizer route and verify CORS
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hub-api-deploy"
          route_ok=false

          for attempt in $(seq 1 30); do
            health_code="$(curl --silent --show-error --output "$work/hub-health.json" --write-out '%{http_code}' "$HUB_PUBLIC_BASE/api/v1/health")"
            probe_code="$(curl --silent --show-error \
              --output "$work/hub-organizer-probe.json" \
              --write-out '%{http_code}' \
              -X PUT \
              -H 'Origin: https://web.chess-publisher.org' \
              -H 'Content-Type: application/json' \
              -H 'X-Expected-Revision: 0' \
              --data '{}' \
              "$HUB_PUBLIC_BASE/api/v1/organizer/tournaments/hub_route_probe_does_not_exist/snapshot")"
            error_code="$(python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'hub-api-deploy' / 'hub-organizer-probe.json'
          try:
              print((json.loads(p.read_text()) or {}).get('error') or '')
          except Exception:
              print('')
          PY
            )"

            if [ "$health_code" = "200" ] && [ "$probe_code" = "404" ] && [ "$error_code" = "tournament_not_found" ]; then
              route_ok=true
              echo "Organizer-owned snapshot route is live (attempt $attempt)."
              break
            fi
            echo "Waiting for Hub route propagation (attempt $attempt: health=$health_code probe=$probe_code error=$error_code)."
            sleep 3
          done
          test "$route_ok" = true

          cors_headers="$(curl --silent --show-error --dump-header - --output /dev/null \
            -X OPTIONS \
            -H 'Origin: https://web.chess-publisher.org' \
            -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-expected-revision' \
            "$HUB_PUBLIC_BASE/api/v1/organizer/tournaments/hub_route_probe_does_not_exist/snapshot")"
          printf '%s\n' "$cors_headers" | grep -qi '^access-control-allow-origin: https://web.chess-publisher.org'
          printf '%s\n' "$cors_headers" | grep -qi 'authorization'
          printf '%s\n' "$cors_headers" | grep -qi 'x-expected-revision'

      - name: Roll back previous version if a newly uploaded patch fails live verification
        if: failure() && steps.upload.outputs.changed == 'true'
        shell: bash
        env:
          PREVIOUS_VERSION: ${{ steps.inspect.outputs.previous_version_id }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hub-api-deploy"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}/deployments?force=true"
          python - <<'PY' > "$work/rollback-body.json"
          import json, os
          print(json.dumps({
              'strategy': 'percentage',
              'versions': [{'percentage': 100, 'version_id': os.environ['PREVIOUS_VERSION']}],
              'annotations': {'workers/message': 'Automatic rollback after Tournament Hub smoke-test failure'}
          }))
          PY
          status="$(curl --silent --show-error \
            --output "$work/rollback-result.json" \
            --write-out '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "@$work/rollback-body.json" \
            "$endpoint")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'hub-api-deploy' / 'rollback-result.json'
          try:
              data = json.loads(p.read_text())
              for err in data.get('errors') or []:
                  print(f"Rollback error {err.get('code')}: {err.get('message')}")
          except Exception:
              print('Rollback failed with a non-JSON response.')
          PY
            exit 1
          fi
          echo 'Previous active Hub Worker version restored.'
