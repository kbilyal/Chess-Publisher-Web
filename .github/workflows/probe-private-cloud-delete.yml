name: Probe Private Cloud Delete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-private-cloud-delete.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe unauthenticated DELETE route without mutation
        shell: bash
        run: |
          set -euo pipefail
          base='https://chess-publisher-hub-api-beta.kyamranbilyal.workers.dev'
          code="$(curl --silent --show-error --output /tmp/body.json --write-out '%{http_code}' -X DELETE "$base/api/v1/cloud/tournaments/probe-does-not-exist")"
          echo "DELETE_STATUS=$code"
          cat /tmp/body.json || true
          # Existing protected route should reject unauthenticated access (401/403/404), not 405.
          test "$code" != '405'
