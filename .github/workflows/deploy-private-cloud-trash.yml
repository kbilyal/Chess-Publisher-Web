name: Deploy Private Cloud Trash Routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-private-cloud-trash.yml'
      - 'scripts/patch-private-cloud-archive-worker.py'

permissions:
  contents: read

env:
  HUB_WORKER_NAME: chess-publisher-hub-api-beta
  HUB_PUBLIC_BASE: https://chess-publisher-hub-api-beta.kyamranbilyal.workers.dev
  ORGANIZER_ROUTES_SHA256: f5cdcd77812898a6ac04ed3659ba776684159534a663398fea2279257fcf0679

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Recover current Worker and active version
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          work="$RUNNER_TEMP/private-cloud-trash"
          mkdir -p "$work"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error --location -H "$auth" "$api" -o "$work/live.multipart"
          curl --fail --silent --show-error -H "$auth" "$api/deployments" -o "$work/deployments.json"
          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib, json, os
          work=Path(os.environ['RUNNER_TEMP'])/'private-cloud-trash'
          raw=(work/'live.multipart').read_bytes(); first=raw.splitlines()[0].decode('ascii','strict')
          if not first.startswith('--'): raise SystemExit('Unexpected Worker content format')
          boundary=first[2:]
          msg=BytesParser(policy=default).parsebytes((f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
          parts=list(msg.iter_parts())
          if len(parts)!=1: raise SystemExit(f'Expected one module, got {len(parts)}')
          src=parts[0].get_payload(decode=True) or b''
          (work/'worker.js').write_bytes(src)
          sha=hashlib.sha256(src).hexdigest()
          already=b'private_cloud_archive_v1' in src
          if not already and sha != os.environ['ORGANIZER_ROUTES_SHA256']:
              raise SystemExit(f'Refusing unexpected live Worker SHA256: {sha}')
          dep=json.loads((work/'deployments.json').read_text())
          rows=(dep.get('result') or {}).get('deployments') or []
          versions=(rows[0].get('versions') if rows else None) or []
          if len(versions)!=1 or float(versions[0].get('percentage') or 0)!=100:
              raise SystemExit('Expected one 100% active Worker version')
          previous=str(versions[0].get('version_id') or '')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f'already={str(already).lower()}\n')
              out.write(f'previous_version={previous}\n')
          print(f'LIVE_WORKER_SHA256={sha}')
          print(f'ARCHIVE_ROUTES_ALREADY_PRESENT={str(already).lower()}')
          PY
      - name: Apply reversible archive patch
        if: steps.recover.outputs.already != 'true'
        run: python scripts/patch-private-cloud-archive-worker.py "$RUNNER_TEMP/private-cloud-trash/worker.js"
      - name: Validate patched Worker and capture SHA
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          worker="$RUNNER_TEMP/private-cloud-trash/worker.js"
          node --check "$worker"
          grep -Fq 'private_cloud_archive_v1' "$worker"
          grep -Fq 'listArchivedCloudTournaments' "$worker"
          grep -Fq 'archiveCloudTournament' "$worker"
          grep -Fq 'restoreArchivedCloudTournament' "$worker"
          grep -Fq 'cloud_expected_revision_required' "$worker"
          sha="$(sha256sum "$worker" | awk '{print $1}')"
          echo "target_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "TARGET_WORKER_SHA256=$sha"
      - name: Upload patched Worker
        id: upload
        if: steps.recover.outputs.already != 'true'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/private-cloud-trash"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}/content"
          status="$(curl --silent --show-error --output "$work/update.json" --write-out '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F "worker.js=@$work/worker.js;type=application/javascript+module" \
            "$endpoint")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then cat "$work/update.json"; exit 1; fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Verify live routes without mutating any tournament
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/private-cloud-trash"
          ok=false
          dummy='cloud_00000000000000000000000000000000'
          for attempt in $(seq 1 30); do
            list_code="$(curl --silent --show-error --output "$work/list.json" --write-out '%{http_code}' "$HUB_PUBLIC_BASE/api/v1/cloud/tournaments/archived")"
            delete_code="$(curl --silent --show-error --output "$work/delete.json" --write-out '%{http_code}' -X DELETE -H 'X-Expected-Revision: 0' "$HUB_PUBLIC_BASE/api/v1/cloud/tournaments/$dummy")"
            restore_code="$(curl --silent --show-error --output "$work/restore.json" --write-out '%{http_code}' -X POST "$HUB_PUBLIC_BASE/api/v1/cloud/tournaments/$dummy/restore")"
            if [ "$list_code" = '401' ] && [ "$delete_code" = '401' ] && [ "$restore_code" = '401' ]; then ok=true; break; fi
            echo "Waiting for route propagation: archived=$list_code delete=$delete_code restore=$restore_code"
            sleep 2
          done
          test "$ok" = true
          cors="$(curl --silent --show-error --dump-header - --output /dev/null -X OPTIONS \
            -H 'Origin: https://web.chess-publisher.org' \
            -H 'Access-Control-Request-Method: DELETE' \
            -H 'Access-Control-Request-Headers: authorization,x-expected-revision' \
            "$HUB_PUBLIC_BASE/api/v1/cloud/tournaments/$dummy")"
          printf '%s\n' "$cors" | grep -qi '^access-control-allow-origin: https://web.chess-publisher.org'
          printf '%s\n' "$cors" | grep -qi 'DELETE'
          printf '%s\n' "$cors" | grep -qi 'x-expected-revision'
          echo "PRIVATE_CLOUD_TRASH_ROUTE_SMOKE=PASS"
          echo "TARGET_WORKER_SHA256=${{ steps.validate.outputs.target_sha }}"
      - name: Roll back on live verification failure
        if: failure() && steps.upload.outputs.changed == 'true'
        shell: bash
        env:
          PREVIOUS_VERSION: ${{ steps.recover.outputs.previous_version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/private-cloud-trash"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}/deployments?force=true"
          python - <<'PY' > "$work/rollback.json"
          import json, os
          print(json.dumps({'strategy':'percentage','versions':[{'percentage':100,'version_id':os.environ['PREVIOUS_VERSION']}],'annotations':{'workers/message':'Rollback after private Cloud Trash route verification failure'}}))
          PY
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' --data-binary "@$work/rollback.json" "$endpoint" >/dev/null
          echo 'Previous Hub Worker version restored.'
