name: Deploy Cloud SYNC Checker Provenance Parity

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch-cloud-sync-checker-provenance-worker.py'
      - '.github/workflows/deploy-cloud-sync-checker-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUB_WORKER_NAME: chess-publisher-hub-api-beta
  HUB_PUBLIC_BASE: https://chess-publisher-hub-api-beta.kyamranbilyal.workers.dev

jobs:
  deploy:
    name: Align live Worker with schema-7 checker provenance contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Recover and structurally verify exact live Worker
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cloud-sync-checker-provenance"
          mkdir -p "$work"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error --location -H "$auth" "$api" -o "$work/live.multipart"
          curl --fail --silent --show-error -H "$auth" "$api/deployments" -o "$work/deployments-before.json"

          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib, json, os

          work = Path(os.environ['RUNNER_TEMP']) / 'cloud-sync-checker-provenance'
          raw = (work / 'live.multipart').read_bytes()
          first = raw.splitlines()[0].decode('ascii', 'strict')
          if not first.startswith('--'):
              raise SystemExit('Unexpected Hub Worker download format.')
          boundary = first[2:]
          envelope = (f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n').encode() + raw
          msg = BytesParser(policy=default).parsebytes(envelope)
          parts = list(msg.iter_parts())
          if len(parts) != 1:
              raise SystemExit(f'Expected one Worker module, got {len(parts)}.')
          payload = parts[0].get_payload(decode=True) or b''
          source = payload.decode('utf-8', 'strict')
          sha = hashlib.sha256(payload).hexdigest()

          required = [
              'private_cloud_hard_delete_v1',
              'arbiter_access_v1',
              'arbiter_snapshot_b2_v1',
              'private_cloud_sync_lineage_v1',
              'arbiter_clear_result_v1',
              'arbiter_canonical_snapshot_read_v1',
              'cloudSyncSnapshotContentFingerprint',
              'function cloudSyncStripLocal(',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit(f'Missing protected live Worker marker: {marker}')

          fix_marker = 'private_cloud_sync_checker_provenance_v1'
          runtime_keys = ['lastcheckeruisource', 'lastcheckeruibuildversion', 'lastcheckeruicheckedat']
          old_anchor = '  "workingdirectory", "serialport", "usbpath", "dgtport", "connectedorganizer", "organizeraccount",\n'
          had_pending = 'arbiter_pending_delivery_replace_v1' in source

          if fix_marker in source:
              if not all(f'"{key}"' in source for key in runtime_keys):
                  raise SystemExit('Checker-provenance marker exists but the complete key set is missing.')
              state = 'target'
          else:
              if any(f'"{key}"' in source for key in runtime_keys):
                  raise SystemExit('Refusing partially modified checker-provenance Worker state.')
              if source.count(old_anchor) != 1:
                  raise SystemExit('Expected exactly one checker-provenance insertion anchor in live Worker.')
              state = 'baseline'

          (work / 'worker.before.js').write_bytes(payload)
          (work / 'worker.js').write_bytes(payload)

          deployments = json.loads((work / 'deployments-before.json').read_text())
          rows = (deployments.get('result') or {}).get('deployments') or []
          if not rows:
              raise SystemExit('No active Hub deployment returned by Cloudflare.')
          versions = rows[0].get('versions') or []
          if len(versions) != 1 or float(versions[0].get('percentage') or 0) != 100:
              raise SystemExit('Expected one 100% active Hub Worker version.')
          previous = str(versions[0].get('version_id') or '')
          if not previous:
              raise SystemExit('Active deployment has no version id.')

          print('LIVE_BEFORE_SHA256=' + sha)
          print('SOURCE_STATE=' + state)
          print('PENDING_REPLACE_PRESENT=' + str(had_pending).lower())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'source_state={state}\n')
              out.write(f'before_sha={sha}\n')
              out.write(f'previous_version_id={previous}\n')
              out.write(f'had_pending={str(had_pending).lower()}\n')
              if state == 'target':
                  out.write(f'target_sha={sha}\n')
          PY

      - name: Apply one-point schema-7 checker provenance patch
        if: steps.inspect.outputs.source_state == 'baseline'
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cloud-sync-checker-provenance"
          worker="$work/worker.js"
          python -m py_compile scripts/patch-cloud-sync-checker-provenance-worker.py
          python scripts/patch-cloud-sync-checker-provenance-worker.py "$worker"
          sha="$(sha256sum "$worker" | awk '{print $1}')"
          echo "target_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "PATCHED_TARGET_SHA256=$sha"

      - name: Verify exact one-point delta and protected target
        shell: bash
        env:
          SOURCE_STATE: ${{ steps.inspect.outputs.source_state }}
          HAD_PENDING: ${{ steps.inspect.outputs.had_pending }}
          INSPECT_TARGET_SHA: ${{ steps.inspect.outputs.target_sha }}
          PATCH_TARGET_SHA: ${{ steps.patch.outputs.target_sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cloud-sync-checker-provenance"
          worker="$work/worker.js"
          target_sha="${PATCH_TARGET_SHA:-${INSPECT_TARGET_SHA:-}}"
          test -n "$target_sha"
          node --check "$worker"

          python - <<'PY'
          from pathlib import Path
          import os

          work = Path(os.environ['RUNNER_TEMP']) / 'cloud-sync-checker-provenance'
          before = (work / 'worker.before.js').read_text()
          after = (work / 'worker.js').read_text()
          old = '  "workingdirectory", "serialport", "usbpath", "dgtport", "connectedorganizer", "organizeraccount",\n'
          new = (
              '  "workingdirectory", "serialport", "usbpath", "dgtport",\n'
              '  // private_cloud_sync_checker_provenance_v1\n'
              '  "lastcheckeruisource", "lastcheckeruibuildversion", "lastcheckeruicheckedat",\n'
              '  "connectedorganizer", "organizeraccount",\n'
          )
          required = [
              'private_cloud_hard_delete_v1', 'arbiter_access_v1', 'arbiter_snapshot_b2_v1',
              'private_cloud_sync_lineage_v1', 'arbiter_clear_result_v1',
              'arbiter_canonical_snapshot_read_v1', 'private_cloud_sync_checker_provenance_v1',
              'cloudSyncSnapshotContentFingerprint'
          ]
          for marker in required:
              if marker not in after:
                  raise SystemExit('Missing protected target marker: ' + marker)
          for key in ['lastcheckeruisource', 'lastcheckeruibuildversion', 'lastcheckeruicheckedat']:
              if f'"{key}"' not in after:
                  raise SystemExit('Missing schema-7 runtime key: ' + key)
          if os.environ.get('HAD_PENDING') == 'true' and 'arbiter_pending_delivery_replace_v1' not in after:
              raise SystemExit('Existing pending-result replacement marker was lost.')
          if os.environ.get('SOURCE_STATE') == 'baseline':
              expected = before.replace(old, new, 1)
              if expected != after:
                  raise SystemExit('Worker delta exceeded the single approved checker-provenance replacement.')
          print('CLOUD_SYNC_CHECKER_PROVENANCE_SOURCE=PASS')
          PY

          sha="$(sha256sum "$worker" | awk '{print $1}')"
          test "$sha" = "$target_sha"
          echo "TARGET_SOURCE_SHA256=$sha"

      - name: Upload Worker only for the verified baseline
        id: upload
        if: steps.inspect.outputs.source_state == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cloud-sync-checker-provenance"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}/content"
          status="$(curl --silent --show-error --output "$work/update.json" --write-out '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F "worker.js=@${work}/worker.js;type=application/javascript+module" \
            "$endpoint")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat "$work/update.json"
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Verify exact active Worker and Cloud route safety
        shell: bash
        env:
          HAD_PENDING: ${{ steps.inspect.outputs.had_pending }}
          INSPECT_TARGET_SHA: ${{ steps.inspect.outputs.target_sha }}
          PATCH_TARGET_SHA: ${{ steps.patch.outputs.target_sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cloud-sync-checker-provenance"
          target_sha="${PATCH_TARGET_SHA:-${INSPECT_TARGET_SHA:-}}"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          live_ok=false
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error --location -H "$auth" "$api" -o "$work/live-after.multipart"
            if TARGET_SHA="$target_sha" HAD_PENDING="$HAD_PENDING" python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib, os
          p = Path(os.environ['RUNNER_TEMP']) / 'cloud-sync-checker-provenance' / 'live-after.multipart'
          raw = p.read_bytes()
          boundary = raw.splitlines()[0].decode('ascii', 'strict')[2:]
          msg = BytesParser(policy=default).parsebytes((f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n').encode() + raw)
          parts = list(msg.iter_parts())
          payload = (parts[0].get_payload(decode=True) or b'') if len(parts) == 1 else b''
          src = payload.decode('utf-8', 'strict') if payload else ''
          if hashlib.sha256(payload).hexdigest() != os.environ['TARGET_SHA']:
              raise SystemExit(1)
          for marker in ['private_cloud_sync_lineage_v1', 'private_cloud_sync_checker_provenance_v1', 'arbiter_canonical_snapshot_read_v1']:
              if marker not in src:
                  raise SystemExit(1)
          for key in ['lastcheckeruisource', 'lastcheckeruibuildversion', 'lastcheckeruicheckedat']:
              if f'"{key}"' not in src:
                  raise SystemExit(1)
          if os.environ.get('HAD_PENDING') == 'true' and 'arbiter_pending_delivery_replace_v1' not in src:
              raise SystemExit(1)
          print('LIVE_AFTER_SHA256=' + hashlib.sha256(payload).hexdigest())
          PY
            then
              live_ok=true
              break
            fi
            sleep 3
          done
          test "$live_ok" = true

          dummy='cloud_00000000000000000000000000000000'
          health="$(curl --silent --show-error --output "$work/health.json" --write-out '%{http_code}' "$HUB_PUBLIC_BASE/api/v1/health")"
          workspace_unauth="$(curl --silent --show-error --output "$work/workspace.json" --write-out '%{http_code}' "$HUB_PUBLIC_BASE/api/v1/cloud/workspace")"
          put_unauth="$(curl --silent --show-error --output "$work/put.json" --write-out '%{http_code}' -X PUT -H 'Content-Type: application/json' -H 'X-Expected-Revision: 0' --data '{"baseRevision":0,"snapshot":{}}' "$HUB_PUBLIC_BASE/api/v1/cloud/tournaments/$dummy/snapshot")"
          test "$health" = '200'
          test "$workspace_unauth" = '401'
          test "$put_unauth" = '401'

          cors_put="$(curl --silent --show-error --dump-header - --output /dev/null -X OPTIONS \
            -H 'Origin: https://web.chess-publisher.org' \
            -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-expected-revision' \
            "$HUB_PUBLIC_BASE/api/v1/cloud/tournaments/$dummy/snapshot")"
          printf '%s\n' "$cors_put" | grep -qi '^access-control-allow-origin: https://web.chess-publisher.org'
          printf '%s\n' "$cors_put" | grep -qi 'authorization'
          printf '%s\n' "$cors_put" | grep -qi 'x-expected-revision'
          printf '%s\n' "$cors_put" | grep -qi 'PUT'
          echo 'CLOUD_SYNC_CHECKER_PROVENANCE_PRODUCTION=PASS'

      - name: Roll back previous Worker version if post-upload verification fails
        if: failure() && steps.upload.outputs.changed == 'true'
        shell: bash
        env:
          PREVIOUS_VERSION: ${{ steps.inspect.outputs.previous_version_id }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cloud-sync-checker-provenance"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}/deployments?force=true"
          python - <<'PY' > "$work/rollback.json"
          import json, os
          print(json.dumps({
            'strategy': 'percentage',
            'versions': [{'percentage': 100, 'version_id': os.environ['PREVIOUS_VERSION']}],
            'annotations': {'workers/message': 'Automatic rollback after schema-7 checker provenance SYNC verification failure'}
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "@$work/rollback.json" "$endpoint" >/dev/null
          echo 'Previous active Hub Worker version restored.'
