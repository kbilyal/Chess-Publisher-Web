name: Inspect Private Cloud Revision Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-private-cloud-revision-guard.yml'

permissions:
  contents: read

env:
  HUB_WORKER_NAME: chess-publisher-hub-api-beta

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Print only expected-revision and API error helper snippets
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" -o /tmp/live.multipart
          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          raw=Path('/tmp/live.multipart').read_bytes(); boundary=raw.splitlines()[0].decode()[2:]
          msg=BytesParser(policy=default).parsebytes((f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw)
          src=(list(msg.iter_parts())[0].get_payload(decode=True) or b'').decode(); lines=src.splitlines()
          for needle in ['X-Expected-Revision','class ApiError','function ApiError','current_revision = ?','archived_at']:
              for i,line in enumerate(lines):
                  if needle.lower() in line.lower():
                      a=max(0,i-10); b=min(len(lines),i+30)
                      print(f'--- {needle} lines {a+1}-{b} ---')
                      for j in range(a,b): print(f'{j+1:05d}: {lines[j]}')
                      break
          PY
