name: Diagnose Arbiter Snapshot

on:
  push:
    branches:
      - diag-arbiter-snapshot
    paths:
      - '.github/workflows/diagnose-arbiter-snapshot.yml'

permissions:
  contents: read

env:
  HUB_WORKER_NAME: chess-publisher-hub-api-beta

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact live B2 helper signatures
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/arbiter-snapshot-diag"
          mkdir -p "$work"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$api" -o "$work/live.multipart"
          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import os, re

          work = Path(os.environ['RUNNER_TEMP']) / 'arbiter-snapshot-diag'
          raw = (work / 'live.multipart').read_bytes()
          boundary = raw.splitlines()[0].decode('ascii', 'strict')[2:]
          envelope = (f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n').encode() + raw
          msg = BytesParser(policy=default).parsebytes(envelope)
          source = (list(msg.iter_parts())[0].get_payload(decode=True) or b'').decode('utf-8', 'strict')

          functions = list(re.finditer(r'(?:async\s+)?function\s+([A-Za-z0-9_$]+)\s*\([^)]*\)\s*\{', source))
          targets = {'getCloudCurrentSnapshot', 'b2DownloadJson', 'b2DownloadRaw', 'arbiterSnapshotObject'}
          for index, m in enumerate(functions):
              name = m.group(1)
              if name not in targets:
                  continue
              end = functions[index + 1].start() if index + 1 < len(functions) else len(source)
              body = source[m.start():end]
              print(f'=== {name} ===')
              for line in body.splitlines()[:120]:
                  print(line[:320])
          PY
