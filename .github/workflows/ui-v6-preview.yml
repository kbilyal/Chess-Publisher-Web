name: Hub Companion real-browser preview
on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/companion/**'
      - 'src/components/TournamentSetupTab.tsx'
      - 'src/components/PlayersTab.tsx'
      - 'src/index.css'
      - 'src/companion.css'
      - 'src/main.tsx'
      - 'tests/ui/hub-companion-v1.test.mjs'
      - '.github/workflows/ui-v6-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/ui/hub-companion-v1.test.mjs
      - run: npm run build
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create isolated Companion preview entry
        run: |
          cat > preview-companion.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
              <title>Chess-Publisher Web Companion Preview</title>
            </head>
            <body><div id="root"></div><script type="module" src="/preview-companion.tsx"></script></body>
          </html>
          EOF
          cat > preview-companion.tsx <<'EOF'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { CompanionWorkspace } from './src/companion/CompanionWorkspace.tsx';
          import { createInitialEmptyTournament } from './src/data/initialData.ts';
          import './src/index.css';
          import './src/companion.css';

          const tournament: any = createInitialEmptyTournament('Desktop Sync · Rhodopes Open 2026');
          tournament.settings.country = 'BUL';
          tournament.settings.city = 'Kardzhali';
          tournament.settings.startDate = '2026-10-10';
          tournament.settings.endDate = '2026-10-11';
          tournament.settings.rounds = '7';
          tournament.settings.timeControl = '15+5';
          tournament.settings.tournamentType = 'test';
          tournament.cloud = { schemaVersion: 4, internalId: 'hub-preview-1', cloudTournamentId: 'cloud-preview-1', baseRevision: 12 };
          tournament.online = { hubTournamentId: 'hub-preview-1', publicSlug: 'rhodopes-open', publicPageUrl: 'https://chess-publisher.org/tournaments?id=rhodopes-open', revision: 4 };
          localStorage.setItem('fide_tournament_manager_v2', JSON.stringify(tournament));

          const cloud: any = {
            activeCloud: { id: 'cloud-preview-1', name: tournament.name, revision: 12 },
            status: 'Synced · r12', statusKind: 'ok', busy: false, conflict: false, cloudDirty: false,
            syncNow: async () => {}, pullChanges: async () => {}, publishOnline: async () => {},
            openPublicPage: () => {}, returnToCloudList: async () => {}
          };

          createRoot(document.getElementById('root')!).render(<CompanionWorkspace cloud={cloud} />);
          EOF
      - name: Start real Vite app
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/cp-companion-vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/preview-companion.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cp-companion-vite.log
          exit 1
      - name: Verify desktop and mobile Companion navigation
        run: |
          mkdir -p hub-companion-preview
          cat > capture-companion.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:4173/preview-companion.html';

          async function open(viewport) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
            await page.goto(base, { waitUntil: 'networkidle' });
            await page.waitForTimeout(350);
            if (errors.length) throw new Error(errors.join('\n'));
            return page;
          }

          const desktop = await open({ width: 1440, height: 960 });
          if (!await desktop.locator('.companion-sidebar').isVisible()) throw new Error('Desktop sidebar is not visible.');
          await desktop.getByRole('button', { name: /Players/ }).first().click();
          await desktop.waitForTimeout(200);
          if (!await desktop.getByRole('heading', { name: 'Players' }).count()) throw new Error('Desktop Players navigation failed.');
          await desktop.getByRole('button', { name: /Publish/ }).first().click();
          await desktop.waitForTimeout(200);
          if (!await desktop.getByRole('heading', { name: 'Online Hub' }).count()) throw new Error('Desktop Publish navigation failed.');
          await desktop.screenshot({ path: 'hub-companion-preview/desktop-publish.png', fullPage: true });

          for (const [width, height, name] of [[390,844,'mobile-390'], [360,800,'mobile-360']]) {
            const page = await open({ width, height });
            if (await page.locator('.companion-sidebar').isVisible()) throw new Error(`Desktop sidebar leaked into ${name}.`);
            const nav = page.locator('.companion-mobile-nav');
            if (!await nav.isVisible()) throw new Error(`Mobile bottom navigation missing at ${width}px.`);
            const labels = await nav.locator('button span').allTextContents();
            if (labels.join('|') !== 'Setup|Players|Publish|Tournaments') throw new Error(`Unexpected mobile navigation: ${labels.join('|')}`);
            await nav.getByRole('button', { name: /Players/ }).click();
            await page.waitForTimeout(180);
            if (!await page.getByRole('heading', { name: 'Players' }).count()) throw new Error(`Players tap failed at ${width}px.`);
            await nav.getByRole('button', { name: /Publish/ }).click();
            await page.waitForTimeout(180);
            if (!await page.getByRole('heading', { name: 'Online Hub' }).count()) throw new Error(`Publish tap failed at ${width}px.`);
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            if (overflow > 1) throw new Error(`Horizontal overflow ${overflow}px at ${width}px.`);
            await page.screenshot({ path: `hub-companion-preview/${name}-publish.png`, fullPage: true });
          }
          await browser.close();
          EOF
          node capture-companion.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hub-companion-real-browser-preview
          path: hub-companion-preview/*.png
          if-no-files-found: error
          retention-days: 7
