name: Production Web real-browser UI gate
on:
  pull_request:
    paths:
      - 'production-web/web/ui-v6-production.css'
      - 'production-web/web/ui-v6-cascade-lock.css'
      - 'production-web/web/ui-v6-production.js'
      - 'production-web/web/mobile-app-v7.css'
      - 'production-web/web/mobile-app-v7.js'
      - 'tests/ui/production-v6-deployment.test.mjs'
      - 'tests/ui/mobile-app-v7.test.mjs'
      - '.github/workflows/production-v6-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-browser-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Static presentation contracts
        run: |
          node tests/ui/production-v6-deployment.test.mjs
          node tests/ui/mobile-app-v7.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Assemble exact production shell
        run: |
          rm -rf production-v7-preview production-v7-screens
          mkdir -p production-v7-preview production-v7-screens
          cp -R production-web/. production-v7-preview/
          python - <<'PY'
          from pathlib import Path
          p = Path('production-v7-preview/index.html')
          text = p.read_text(encoding='utf-8')
          style = '<link rel="stylesheet" href="/web/ui-v6-production.css?v=preview">'
          lock = '<link rel="stylesheet" href="/web/ui-v6-cascade-lock.css?v=preview">'
          script = '<script src="/web/ui-v6-production.js?v=preview"></script>'
          if style not in text:
              text = text.replace('</head>', style + '\n' + lock + '\n</head>')
          elif lock not in text:
              text = text.replace('</head>', lock + '\n</head>')
          if script not in text:
              text = text.replace('</body>', script + '\n</body>')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Start exact production preview
        run: |
          python3 -m http.server 4174 --directory production-v7-preview > /tmp/cpv7.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cpv7.log
          exit 1
      - name: Verify desktop and Facebook-style mobile navigation
        run: |
          cat > capture-production-v7.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:4174';

          async function exposeApp(page) {
            await page.goto(base, { waitUntil: 'networkidle' });
            await page.waitForTimeout(900);
            await page.evaluate(() => {
              const login = document.querySelector('#cpBeta7Start');
              if (login) login.style.setProperty('display', 'none', 'important');
              const app = document.querySelector('#appWindow');
              if (app) {
                app.classList.remove('cp-beta7-app-hidden');
                app.style.removeProperty('display');
                app.style.removeProperty('visibility');
              }
              document.querySelectorAll('.cp-beta7-app-hidden').forEach(node => node.classList.remove('cp-beta7-app-hidden'));
            });
            await page.waitForFunction(() => document.documentElement.dataset.cpMobileApp === '7');
            await page.waitForTimeout(250);
          }

          async function ensureTournament(page) {
            const exists = await page.evaluate(() => {
              try { return Boolean(window.getCurrentTournament?.()); } catch { return false; }
            });
            if (exists) return;
            await page.evaluate(() => {
              const screen = document.querySelector('#createScreen');
              if (screen) screen.style.removeProperty('display');
              const name = document.querySelector('#firstTournamentName');
              if (name) {
                name.value = 'Mobile App v7 Regression';
                name.dispatchEvent(new Event('input', { bubbles: true }));
                name.dispatchEvent(new Event('change', { bubbles: true }));
              }
              if (typeof window.createFirstTournament === 'function') window.createFirstTournament();
            });
            await page.waitForTimeout(450);
            const created = await page.evaluate(() => {
              try { return Boolean(window.getCurrentTournament?.()); } catch { return false; }
            });
            if (!created) throw new Error('Could not create test tournament through existing production creation flow.');
          }

          async function activeLegacyId(page) {
            return page.evaluate(() => {
              const tab = Array.from(document.querySelectorAll('#appWindow > .tabs > .tab')).find(node => node.classList.contains('active') || node.getAttribute('aria-selected') === 'true');
              return tab?.id || '';
            });
          }

          async function assertNoNavOverlap(page) {
            const problems = await page.locator('#cpMobileAppNav .cp-mobile-nav-item').evaluateAll(nodes => nodes.map(node => {
              const label = node.querySelector('.cp-mobile-nav-label');
              const box = node.getBoundingClientRect();
              return {
                text: label?.textContent || '',
                width: box.width,
                labelClient: label?.clientWidth || 0,
                labelScroll: label?.scrollWidth || 0
              };
            }).filter(item => item.width < 50 || item.labelScroll > item.labelClient + 2));
            if (problems.length) throw new Error(`Mobile nav overlap/overflow: ${JSON.stringify(problems)}`);
          }

          async function clickMobile(page, label) {
            const button = page.locator('#cpMobileAppNav .cp-mobile-nav-item').filter({ hasText: label }).first();
            if (!(await button.count())) throw new Error(`Missing mobile nav button: ${label}`);
            await button.click();
            await page.waitForTimeout(180);
          }

          const desktop = await browser.newPage({ viewport: { width: 1728, height: 1000 } });
          await exposeApp(desktop);
          await ensureTournament(desktop);
          const desktopState = await desktop.evaluate(() => ({
            mobileDisplay: getComputedStyle(document.querySelector('#cpMobileAppNav')).display,
            tabsLeft: document.querySelector('#appWindow > .tabs').getBoundingClientRect().left,
            tabsWidth: document.querySelector('#appWindow > .tabs').getBoundingClientRect().width
          }));
          if (desktopState.mobileDisplay !== 'none') throw new Error(`Mobile nav leaked into desktop: ${JSON.stringify(desktopState)}`);
          if (desktopState.tabsLeft < -100 || desktopState.tabsWidth < 180) throw new Error(`Desktop sidebar is not visible: ${JSON.stringify(desktopState)}`);
          await desktop.screenshot({ path: 'production-v7-screens/desktop.png', fullPage: false });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
          await exposeApp(mobile);
          await ensureTournament(mobile);
          const mobileState = await mobile.evaluate(() => {
            const nav = document.querySelector('#cpMobileAppNav');
            const legacy = document.querySelector('#appWindow > .tabs');
            const legacyStyle = getComputedStyle(legacy);
            const legacyBox = legacy.getBoundingClientRect();
            return {
              navDisplay: getComputedStyle(nav).display,
              navButtons: nav.querySelectorAll('.cp-mobile-nav-item').length,
              legacyOpacity: legacyStyle.opacity,
              legacyPointerEvents: legacyStyle.pointerEvents,
              legacyWidth: legacyBox.width,
              legacyHeight: legacyBox.height,
              dgtInMobileNav: /DGT/i.test(nav.textContent || '')
            };
          });
          if (mobileState.navDisplay === 'none' || mobileState.navButtons !== 5) throw new Error(`Mobile app nav not rendered correctly: ${JSON.stringify(mobileState)}`);
          if (mobileState.legacyOpacity !== '0' || mobileState.legacyPointerEvents !== 'none' || mobileState.legacyWidth > 2 || mobileState.legacyHeight > 2) throw new Error(`Legacy mobile tab strip still visible or interactive: ${JSON.stringify(mobileState)}`);
          if (mobileState.dgtInMobileNav) throw new Error('DGT appeared in the mobile Web navigation.');
          await assertNoNavOverlap(mobile);

          await clickMobile(mobile, 'Players');
          if (await activeLegacyId(mobile) !== 'tabRegistration') throw new Error('Players mobile navigation did not activate the existing registration tab.');
          await clickMobile(mobile, 'Setup');
          if (await activeLegacyId(mobile) !== 'tabMain') throw new Error('Setup mobile navigation did not return to Tournament Setup.');

          const pairingsDisabled = await mobile.locator('#tabPairings').evaluate(node => node.classList.contains('disabled') || node.getAttribute('aria-disabled') === 'true');
          await clickMobile(mobile, 'Pairings');
          if (pairingsDisabled) {
            const toastVisible = await mobile.locator('#cpMobileToast').evaluate(node => node.classList.contains('is-visible') && /Add players first/i.test(node.textContent || ''));
            if (!toastVisible) throw new Error('Disabled Pairings did not explain why the section is unavailable.');
          } else if (await activeLegacyId(mobile) !== 'tabPairings') {
            throw new Error('Pairings mobile navigation did not activate the existing Pairings tab.');
          }

          await clickMobile(mobile, 'More');
          const sheetOpen = await mobile.locator('#cpMobileMoreSheet').evaluate(node => node.classList.contains('is-open'));
          if (!sheetOpen) throw new Error('More bottom sheet did not open.');
          await mobile.locator('#cpMobileMoreSheet .cp-mobile-more-item').filter({ hasText: 'Schedule' }).click();
          await mobile.waitForTimeout(180);
          if (await activeLegacyId(mobile) !== 'tabSchedule') throw new Error('Schedule from More sheet did not activate the existing Schedule tab.');
          await mobile.screenshot({ path: 'production-v7-screens/mobile-390.png', fullPage: false });

          const narrow = await browser.newPage({ viewport: { width: 360, height: 800 } });
          await exposeApp(narrow);
          await ensureTournament(narrow);
          await assertNoNavOverlap(narrow);
          await clickMobile(narrow, 'Players');
          if (await activeLegacyId(narrow) !== 'tabRegistration') throw new Error('360px Players navigation failed.');
          await narrow.screenshot({ path: 'production-v7-screens/mobile-360.png', fullPage: false });

          await browser.close();
          console.log('PASS desktop sidebar + Mobile App v7 navigation at 390px and 360px');
          EOF
          node capture-production-v7.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-mobile-app-v7-preview
          path: production-v7-screens/*.png
          if-no-files-found: error
          retention-days: 7
