name: Production UI v6 real-browser preview
on:
  pull_request:
    paths:
      - 'production-web/web/ui-v6-production.css'
      - 'production-web/web/ui-v6-cascade-lock.css'
      - 'production-web/web/ui-v6-production.js'
      - 'tests/ui/production-v6-deployment.test.mjs'
      - '.github/workflows/deploy-web.yml'
      - '.github/workflows/production-v6-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview-production-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node tests/ui/production-v6-deployment.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Assemble production shell with v6 presentation
        run: |
          rm -rf production-v6-preview
          mkdir -p production-v6-preview
          cp -R production-web/. production-v6-preview/
          python - <<'PY'
          from pathlib import Path
          p = Path('production-v6-preview/index.html')
          text = p.read_text(encoding='utf-8')
          style = '<link rel="stylesheet" href="/web/ui-v6-production.css?v=preview">'
          lock = '<link rel="stylesheet" href="/web/ui-v6-cascade-lock.css?v=preview">'
          script = '<script src="/web/ui-v6-production.js?v=preview"></script>'
          if style not in text:
              text = text.replace('</head>', style + '\n' + lock + '\n</head>')
          elif lock not in text:
              text = text.replace('</head>', lock + '\n</head>')
          if script not in text:
              text = text.replace('</body>', script + '\n</body>')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Start exact production preview
        run: |
          python3 -m http.server 4174 --directory production-v6-preview > /tmp/cpv6-production.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4174 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cpv6-production.log
          exit 1
      - name: Verify mobile tab interaction and capture production shell
        run: |
          mkdir -p production-v6-screens
          cat > capture-production-v6.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:4174';

          async function exposeApp(page) {
            await page.goto(base, { waitUntil: 'networkidle' });
            await page.waitForTimeout(1200);
            await page.evaluate(() => {
              const login = document.querySelector('#cpBeta7Start');
              if (login) login.style.setProperty('display', 'none', 'important');
              const app = document.querySelector('#appWindow');
              if (app) {
                app.classList.remove('cp-beta7-app-hidden');
                app.style.removeProperty('display');
                app.style.removeProperty('visibility');
              }
              document.querySelectorAll('.cp-beta7-app-hidden').forEach(node => node.classList.remove('cp-beta7-app-hidden'));
            });
            const setup = page.getByText('Tournament Setup', { exact: true });
            if (await setup.count()) {
              await setup.first().click();
              await page.waitForTimeout(250);
            }
          }

          async function ensureTestTournament(page) {
            const before = await page.evaluate(() => {
              try { return typeof window.getCurrentTournament === 'function' ? window.getCurrentTournament() : null; } catch { return null; }
            });
            if (before) return true;

            const probe = await page.evaluate(() => {
              const describe = value => value && typeof value === 'object' ? { keys: Object.keys(value).slice(0, 40), name: value.name || value.tournamentName || value.settings?.eventName || '' } : { type: typeof value };
              let emptyResult = null;
              try {
                if (typeof window.createEmptyTournament === 'function') emptyResult = describe(window.createEmptyTournament());
              } catch (error) { emptyResult = { error: String(error) }; }
              let current = null;
              try { current = typeof window.getCurrentTournament === 'function' ? window.getCurrentTournament() : null; } catch {}
              return { emptyResult, currentAfterEmpty: current ? describe(current) : null };
            });
            console.log(`CPV6_CREATE_EMPTY_PROBE=${JSON.stringify(probe)}`);

            let current = await page.evaluate(() => {
              try { return typeof window.getCurrentTournament === 'function' ? window.getCurrentTournament() : null; } catch { return null; }
            });
            if (current) return true;

            const createInputs = await page.evaluate(() => Array.from(document.querySelectorAll('#createScreen input, #createScreen select, #createScreen textarea')).map(node => ({
              tag: node.tagName,
              id: node.id || '',
              name: node.name || '',
              type: node.type || '',
              placeholder: node.placeholder || '',
              value: node.value || ''
            })));
            console.log(`CPV6_CREATE_INPUTS=${JSON.stringify(createInputs)}`);

            await page.evaluate(() => {
              const screen = document.querySelector('#createScreen');
              if (screen) screen.style.removeProperty('display');
              const fields = Array.from(document.querySelectorAll('#createScreen input, #createScreen textarea'));
              for (const field of fields) {
                const key = `${field.id || ''} ${field.name || ''} ${field.placeholder || ''}`.toLowerCase();
                if (field.type === 'text' && !field.value) field.value = key.includes('name') ? 'UI Mobile Regression Test' : 'Test';
                if (field.type === 'number' && !field.value) field.value = key.includes('round') ? '7' : '1';
                if (field.type === 'date' && !field.value) field.value = '2026-09-07';
                field.dispatchEvent(new Event('input', { bubbles: true }));
                field.dispatchEvent(new Event('change', { bubbles: true }));
              }
              try {
                if (typeof window.createFirstTournament === 'function') window.createFirstTournament();
              } catch (error) {
                console.log('CPV6_CREATE_FIRST_ERROR', String(error));
              }
            });
            await page.waitForTimeout(500);

            current = await page.evaluate(() => {
              try { return typeof window.getCurrentTournament === 'function' ? window.getCurrentTournament() : null; } catch { return null; }
            });
            console.log(`CPV6_TEST_TOURNAMENT_CREATED=${Boolean(current)}`);
            return Boolean(current);
          }

          async function diagnostics(page, tag) {
            const data = await page.evaluate(() => {
              let current = null;
              try { current = typeof window.getCurrentTournament === 'function' ? window.getCurrentTournament() : null; } catch {}
              const tabs = Array.from(document.querySelectorAll('#appWindow > .tabs > .tab')).map(tab => ({
                id: tab.id || '',
                text: (tab.textContent || '').trim(),
                onclick: tab.getAttribute('onclick') || '',
                disabled: tab.classList.contains('disabled') || tab.getAttribute('aria-disabled') === 'true',
                active: tab.classList.contains('active') || tab.getAttribute('aria-selected') === 'true'
              }));
              return { current: current ? { name: current.name || current.tournamentName || current.settings?.eventName || '', keys: Object.keys(current).slice(0, 30) } : null, tabs, showTabType: typeof window.showTab };
            });
            console.log(`CPV6_DIAGNOSTICS_${tag}=${JSON.stringify(data)}`);
            return data;
          }

          async function tabLocator(page, label) {
            return page.locator('#appWindow > .tabs > .tab').filter({ hasText: label }).first();
          }

          async function tabDisabled(page, label) {
            const tab = await tabLocator(page, label);
            if (!(await tab.count())) return true;
            return tab.evaluate(node => node.classList.contains('disabled') || node.getAttribute('aria-disabled') === 'true');
          }

          async function tapIconArea(page, label) {
            const tab = await tabLocator(page, label);
            if (!(await tab.count())) return { exists: false, active: false };
            await tab.scrollIntoViewIfNeeded();
            const box = await tab.boundingBox();
            if (!box) throw new Error(`No mobile tab bounds: ${label}`);
            const hit = await page.evaluate(({ x, y }) => {
              const node = document.elementFromPoint(x, y);
              return node ? { tag: node.tagName, id: node.id || '', cls: node.className || '', text: (node.textContent || '').trim() } : null;
            }, { x: box.x + box.width / 2, y: box.y + 12 });
            console.log(`CPV6_HIT_${label.replace(/\W+/g, '_')}=${JSON.stringify(hit)}`);
            await page.mouse.click(box.x + box.width / 2, box.y + 12);
            await page.waitForTimeout(300);
            const active = await tab.evaluate(node => node.classList.contains('active') || node.getAttribute('aria-selected') === 'true');
            return { exists: true, active };
          }

          async function assertMobileLabelsContained(page) {
            const problems = await page.locator('#appWindow > .tabs > .tab').evaluateAll(tabs => tabs.map(tab => {
              const style = getComputedStyle(tab);
              const after = getComputedStyle(tab, '::after');
              return {
                label: (tab.textContent || '').trim(),
                mobileLabel: tab.dataset.cpv6MobileLabel || '',
                clientWidth: tab.clientWidth,
                scrollWidth: tab.scrollWidth,
                overflow: style.overflow,
                afterContent: after.content
              };
            }).filter(item => !item.mobileLabel || item.scrollWidth > item.clientWidth + 2 || item.afterContent === 'none' || item.afterContent === 'normal'));
            if (problems.length) throw new Error(`Mobile tab label overflow/metadata failure: ${JSON.stringify(problems)}`);
          }

          async function assertMobileTabSurface(page) {
            const tabsStyle = await page.locator('#appWindow > .tabs').evaluate(node => {
              const style = getComputedStyle(node);
              return { position: style.position, bottom: style.bottom, zIndex: style.zIndex, overflowX: style.overflowX };
            });
            console.log(`CPV6_MOBILE_TABS_STYLE=${JSON.stringify(tabsStyle)}`);
            if (tabsStyle.position === 'sticky' || tabsStyle.position === 'fixed') {
              throw new Error(`Legacy sticky/fixed mobile tab layer still active: ${JSON.stringify(tabsStyle)}`);
            }
          }

          async function assertTabSwitch(page, fromLabel, toLabel, { allowDisabled = false } = {}) {
            const from = await tapIconArea(page, fromLabel);
            if (!from.active) throw new Error(`Could not activate ${fromLabel} before switch test.`);
            if (await tabDisabled(page, toLabel)) {
              if (allowDisabled) {
                console.log(`CPV6_EXPECTED_DISABLED_TAB=${toLabel}`);
                return 'disabled';
              }
              throw new Error(`${toLabel} is unexpectedly disabled in the real-browser tab switch test.`);
            }
            const to = await tapIconArea(page, toLabel);
            if (!to.active) throw new Error(`Mobile tab tap did not activate ${toLabel}.`);
            const back = await tapIconArea(page, fromLabel);
            if (!back.active) throw new Error(`Mobile tab tap could not return to ${fromLabel}.`);
            return 'switched';
          }

          const desktop = await browser.newPage({ viewport: { width: 1728, height: 1000 }, deviceScaleFactor: 1 });
          await exposeApp(desktop);
          await desktop.screenshot({ path: 'production-v6-screens/desktop-production-shell.png', fullPage: false });

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
          await exposeApp(mobile);
          const created390 = await ensureTestTournament(mobile);
          await diagnostics(mobile, '390');
          await assertMobileLabelsContained(mobile);
          await assertMobileTabSurface(mobile);
          if (!created390) throw new Error('Real-browser test could not create a tournament through the existing production creation function.');
          await assertTabSwitch(mobile, 'Tournament Setup', 'Lists & Players');
          await assertTabSwitch(mobile, 'Tournament Setup', 'Pairings', { allowDisabled: true });
          await mobile.screenshot({ path: 'production-v6-screens/mobile-production-shell.png', fullPage: false });

          const narrow = await browser.newPage({ viewport: { width: 360, height: 800 }, deviceScaleFactor: 1 });
          await exposeApp(narrow);
          const created360 = await ensureTestTournament(narrow);
          await diagnostics(narrow, '360');
          await assertMobileLabelsContained(narrow);
          await assertMobileTabSurface(narrow);
          if (!created360) throw new Error('360px test could not create a tournament through the existing production creation function.');
          await assertTabSwitch(narrow, 'Tournament Setup', 'Lists & Players');
          await assertTabSwitch(narrow, 'Tournament Setup', 'Pairings', { allowDisabled: true });

          await browser.close();
          console.log('PASS real mobile tournament tab switching and compact labels at 390px and 360px');
          EOF
          node capture-production-v6.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-v6-real-browser-preview
          path: production-v6-screens/*.png
          if-no-files-found: error
          retention-days: 7
