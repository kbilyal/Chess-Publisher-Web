name: Apply Chess-Results Upload Data Button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-cr-upload-button.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply authenticated Upload Data action
        run: python scripts/apply-cr-upload-button.py
      - name: Validate Upload Data button and protected contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          node workers/chess-results/worker.test.mjs
          npm run test:chess-results-companion
          npm run test:chess-results
          npm run test:cloud-roundtrip
          npm run test:desktop-beta34-web-parity
          npm run test:trf
          node tests/ui/companion-cloud-screens.test.mjs
          node tests/ui/hub-companion-v1.test.mjs
          npm run build
      - name: Commit validated implementation and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-cr-upload-button.yml scripts/apply-cr-upload-button.py
          git add src/companion/CompanionWorkspace.tsx workers/chess-results/worker.js workers/chess-results/worker.test.mjs src/cloud/tests/runCompanionChessResultsTransportTests.ts
          git commit -m "Add authenticated Chess-Results Upload Data button"
          git push origin HEAD:main
