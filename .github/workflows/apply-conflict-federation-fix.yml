name: Apply Conflict and Federation Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-conflict-federation-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-conflict-federation-fix.py
          python - <<'PY'
          from pathlib import Path

          actions = Path('src/companion/companionCloudActions.ts')
          source = actions.read_text()
          original = """async function smartPullChanges(
            cloud: any,
            tournament: Tournament,
            strategy: 'safe' | 'web' | 'cloud' = 'safe'
          ) {"""
          replacement = """async function smartPullChangesWithStrategy(
            cloud: any,
            tournament: Tournament,
            strategy: 'safe' | 'web' | 'cloud' = 'safe'
          ) {"""
          if original not in source:
              raise SystemExit('Strategy resolver signature anchor not found')
          source = source.replace(original, replacement, 1)

          sync_anchor = "\n\nasync function syncNowConfirmed(cloud: any, tournament: Tournament) {"
          wrapper = """

          async function smartPullChanges(cloud: any, tournament: Tournament) {
            // Resolve Conflict is intentionally local-only.
            return smartPullChangesWithStrategy(cloud, tournament, 'safe');
          }"""
          if sync_anchor not in source:
              raise SystemExit('syncNowConfirmed anchor not found')
          source = source.replace(sync_anchor, wrapper + sync_anchor, 1)

          old_facade = "resolveConflict: (tournament: Tournament, strategy: 'safe' | 'web' | 'cloud' = 'safe') => smartPullChanges(cloud, tournament, strategy),"
          new_facade = """resolveConflict: (tournament: Tournament) => smartPullChanges(cloud, tournament),
              resolveConflictWithStrategy: (tournament: Tournament, strategy: 'web' | 'cloud') => smartPullChangesWithStrategy(cloud, tournament, strategy),"""
          if old_facade not in source:
              raise SystemExit('Conflict facade anchor not found')
          source = source.replace(old_facade, new_facade, 1)
          actions.write_text(source)

          workspace = Path('src/companion/CompanionWorkspace.tsx')
          source = workspace.read_text()
          old_type = "  resolveConflict: (tournament: Tournament, strategy?: 'safe' | 'web' | 'cloud') => Promise<any>;"
          new_type = """  resolveConflict: (tournament: Tournament) => Promise<any>;
            resolveConflictWithStrategy: (tournament: Tournament, strategy: 'web' | 'cloud') => Promise<any>;"""
          if old_type not in source:
              raise SystemExit('Workspace conflict interface anchor not found')
          source = source.replace(old_type, new_type, 1)
          old_call = "      const result = await cloud.resolveConflict(tournamentRef.current, strategy);"
          new_call = """      const result = strategy === 'safe'
                ? await cloud.resolveConflict(tournamentRef.current)
                : await cloud.resolveConflictWithStrategy(tournamentRef.current, strategy);"""
          if old_call not in source:
              raise SystemExit('Workspace conflict call anchor not found')
          source = source.replace(old_call, new_call, 1)
          workspace.write_text(source)

          test = Path('src/cloud/tests/runCompanionSyncContractTests.ts')
          source = test.read_text()
          old_assert = "assert.match(actions, /resolveConflict: \\(tournament: Tournament, strategy: 'safe' \\| 'web' \\| 'cloud'/);"
          new_assert = """assert.match(actions, /resolveConflict: \\(tournament: Tournament\\) => smartPullChanges/);
          assert.match(actions, /resolveConflictWithStrategy: \\(tournament: Tournament, strategy: 'web' \\| 'cloud'\\)/);"""
          if old_assert not in source:
              raise SystemExit('Sync contract strategy assertion anchor not found')
          source = source.replace(old_assert, new_assert, 1)
          test.write_text(source)
          PY
      - name: Validate conflict, federation and protected publication paths
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run test:cloud-roundtrip
          npm run test:online-cloud
          npm run test:online-cloud-beta5
          npm run test:chess-results-companion
          npm run test:chess-results
          npm run test:trf
          node tests/ui/hub-companion-v1.test.mjs
          node tests/ui/companion-cloud-screens.test.mjs
          npm run build
      - name: Commit validated implementation and remove one-time repair files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-conflict-federation-fix.yml scripts/apply-conflict-federation-fix.py
          git add src/data/initialData.ts src/companion/CompanionSetup.tsx src/companion/CompanionWorkspace.tsx src/companion/companionCloudActions.ts src/cloud/tests/runCompanionConflictMergeTests.ts src/cloud/tests/runCompanionSyncContractTests.ts
          git commit -m "Fix resolvable sync conflicts and complete FIDE federations"
          git push origin HEAD:main
