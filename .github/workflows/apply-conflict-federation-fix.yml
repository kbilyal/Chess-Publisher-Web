name: Apply Conflict and Federation Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-conflict-federation-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-conflict-federation-fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/companion/companionCloudActions.ts')
          source = path.read_text()
          original = """async function smartPullChanges(
            cloud: any,
            tournament: Tournament,
            strategy: 'safe' | 'web' | 'cloud' = 'safe'
          ) {"""
          replacement = """async function smartPullChangesWithStrategy(
            cloud: any,
            tournament: Tournament,
            strategy: 'safe' | 'web' | 'cloud' = 'safe'
          ) {"""
          if original not in source:
              raise SystemExit('Strategy resolver signature anchor not found')
          source = source.replace(original, replacement, 1)
          sync_anchor = "\n\nasync function syncNowConfirmed(cloud: any, tournament: Tournament) {"
          wrapper = """

          async function smartPullChanges(cloud: any, tournament: Tournament) {
            // Resolve Conflict is intentionally local-only.
            return smartPullChangesWithStrategy(cloud, tournament, 'safe');
          }"""
          if sync_anchor not in source:
              raise SystemExit('syncNowConfirmed anchor not found')
          source = source.replace(sync_anchor, wrapper + sync_anchor, 1)
          old_facade = "resolveConflict: (tournament: Tournament, strategy: 'safe' | 'web' | 'cloud' = 'safe') => smartPullChanges(cloud, tournament, strategy),"
          new_facade = "resolveConflict: (tournament: Tournament, strategy: 'safe' | 'web' | 'cloud' = 'safe') => strategy === 'safe' ? smartPullChanges(cloud, tournament) : smartPullChangesWithStrategy(cloud, tournament, strategy),"
          if old_facade not in source:
              raise SystemExit('Conflict facade anchor not found')
          source = source.replace(old_facade, new_facade, 1)
          path.write_text(source)
          PY
      - name: Validate conflict, federation and protected publication paths
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run test:cloud-roundtrip
          npm run test:online-cloud
          npm run test:online-cloud-beta5
          npm run test:chess-results-companion
          npm run test:chess-results
          npm run test:trf
          node tests/ui/hub-companion-v1.test.mjs
          node tests/ui/companion-cloud-screens.test.mjs
          npm run build
      - name: Commit validated implementation and remove one-time repair files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-conflict-federation-fix.yml scripts/apply-conflict-federation-fix.py
          git add src/data/initialData.ts src/companion/CompanionSetup.tsx src/companion/CompanionWorkspace.tsx src/companion/companionCloudActions.ts src/cloud/tests/runCompanionConflictMergeTests.ts src/cloud/tests/runCompanionSyncContractTests.ts
          git commit -m "Fix resolvable sync conflicts and complete FIDE federations"
          git push origin HEAD:main
