name: Deploy Chess-Publisher Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Validate and build Web app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          python -m pip install --disable-pip-version-check -r engine/gacrux/requirements.txt
          chmod +x bin/bbpPairings

      - name: Verify triggering commit checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: TypeScript check
        run: npm run lint

      - name: Online & Cloud beta4 regression
        run: npm run test:online-cloud

      - name: Online & Cloud beta5 Browser Continuation regression
        run: npm run test:online-cloud-beta5

      - name: Desktop-Web Cloud roundtrip regression
        run: npm run test:cloud-roundtrip

      - name: Architecture regression
        shell: bash
        env:
          GACRUX_PATH: ${{ github.workspace }}/engine/gacrux/pairingchecker.py
          BBP_PATH: ${{ github.workspace }}/bin/bbpPairings
        run: |
          set -euo pipefail
          npm run dev > "$RUNNER_TEMP/chess-publisher-test-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat "$RUNNER_TEMP/chess-publisher-test-server.log"
              exit 1
            fi
            sleep 1
          done
          npm run test:arch

      - name: Desktop-Web pairing parity regression
        env:
          GACRUX_PATH: ${{ github.workspace }}/engine/gacrux/pairingchecker.py
          BBP_PATH: ${{ github.workspace }}/bin/bbpPairings
        run: npm run test:parity

      - name: Transaction regression
        run: npm run test:transactions

      - name: Round finalization regression
        run: npm run test:finalization

      - name: FIDE regression
        run: npm run test:fide

      - name: Build Chess-Publisher Web program
        run: npm run build

      - name: Write exact deployment identity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const buildInfo = {
            product: 'Chess-Publisher Web',
            repository: process.env.GITHUB_REPOSITORY,
            branch: 'main',
            commit: process.env.GITHUB_SHA,
            workflowRun: process.env.GITHUB_RUN_ID,
            builtAt: new Date().toISOString()
          };

          writeFileSync('dist/build-info.json', `${JSON.stringify(buildInfo, null, 2)}\n`);
          NODE

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/build-info.json
          test -f dist/CNAME
          test "$(cat dist/CNAME)" = "web.chess-publisher.org"
          find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit | grep -q .
          find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit | grep -q .
          grep -q 'Chess-Publisher FIDE Tournament Manager' dist/index.html
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const info = JSON.parse(readFileSync('dist/build-info.json', 'utf8'));
          if (info.commit !== process.env.GITHUB_SHA) throw new Error('build-info commit does not match GITHUB_SHA');
          if (info.repository !== 'kbilyal/Chess-Publisher-Web') throw new Error('build-info repository mismatch');
          if (info.branch !== 'main') throw new Error('build-info branch mismatch');
          NODE
          find dist -maxdepth 2 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web program artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish Web program
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
