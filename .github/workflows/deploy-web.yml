name: Deploy Chess-Publisher Web Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Validate and build Chess-Publisher Web Companion
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python -m pip install --disable-pip-version-check -r engine/gacrux/requirements.txt
          chmod +x bin/bbpPairings

      - name: Verify triggering commit checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Companion architecture contract
        run: node tests/ui/hub-companion-v1.test.mjs

      - name: Organizer login and My Tournaments contract
        run: node tests/ui/companion-cloud-screens.test.mjs

      - name: TypeScript check
        run: npm run lint

      - name: Online and Cloud regression
        run: npm run test:online-cloud

      - name: Browser continuation regression
        run: npm run test:online-cloud-beta5

      - name: Desktop-Web Cloud roundtrip regression
        run: npm run test:cloud-roundtrip

      - name: Transaction regression
        run: npm run test:transactions

      - name: Round finalization regression
        run: npm run test:finalization

      - name: FIDE regression
        run: npm run test:fide

      - name: Explicit TRF16 and TRF26 regression
        run: npm run test:trf

      - name: Chess-Results publication XML regression
        run: npm run test:chess-results

      - name: Legacy Chess-Results compatibility contract
        run: npm run test:chess-results-web-contract

      - name: Companion Chess-Results secure transport
        run: npm run test:chess-results-companion

      - name: Architecture regression
        shell: bash
        env:
          GACRUX_PATH: ${{ github.workspace }}/engine/gacrux/pairingchecker.py
          BBP_PATH: ${{ github.workspace }}/bin/bbpPairings
        run: |
          set -euo pipefail
          npm run dev > "$RUNNER_TEMP/chess-publisher-test-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat "$RUNNER_TEMP/chess-publisher-test-server.log"
              exit 1
            fi
            sleep 1
          done
          npm run test:arch

      - name: Desktop-Web pairing parity regression
        env:
          GACRUX_PATH: ${{ github.workspace }}/engine/gacrux/pairingchecker.py
          BBP_PATH: ${{ github.workspace }}/bin/bbpPairings
        run: npm run test:parity

      - name: Build clean Vite Companion production artifact
        run: npm run build

      - name: Verify exact Companion production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/CNAME
          test "$(cat dist/CNAME)" = 'web.chess-publisher.org'
          test -s dist/fide/fide_ratings.sqlite
          test -s dist/vendor/sql-wasm.wasm
          test "$(stat -c%s dist/fide/fide_ratings.sqlite)" -gt 1000000
          test "$(stat -c%s dist/vendor/sql-wasm.wasm)" -gt 100000
          grep -Eq 'assets/index-[^" ]+\.js' dist/index.html
          grep -Eq 'assets/index-[^" ]+\.css' dist/index.html
          ! grep -q 'src/main.tsx' dist/index.html
          ! grep -R -E 'AES_KEY|AES_IV' dist/assets --include='*.js'
          grep -R -q 'Continue your desktop tournaments anywhere' dist/assets --include='*.js'
          grep -R -q 'Publish to Chess-Results' dist/assets --include='*.js'
          grep -R -q 'Publish to Online Hub' dist/assets --include='*.js'
          grep -R -q '/api/chess-results/' dist/assets --include='*.js'
          grep -R -q 'chess-publisher-chess-results.kyamranbilyal.workers.dev/api/chess-results/' dist/assets --include='*.js'
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          node -e "const { createHash } = require('node:crypto'); const { readFileSync, writeFileSync } = require('node:fs'); const indexSha256 = createHash('sha256').update(readFileSync('dist/index.html')).digest('hex'); const buildInfo = { product: 'Chess-Publisher Web Companion', source: 'vite-dist', repository: 'kbilyal/Chess-Publisher-Web', branch: 'main', commit: process.env.GITHUB_SHA, indexSha256, builtAt: new Date().toISOString() }; writeFileSync('dist/companion-build-info.json', JSON.stringify(buildInfo, null, 2) + '\n');"
          node -e "const { readFileSync } = require('node:fs'); const info = JSON.parse(readFileSync('dist/companion-build-info.json', 'utf8')); if (info.commit !== process.env.GITHUB_SHA) throw new Error('build-info commit mismatch'); if (info.source !== 'vite-dist') throw new Error('deployment source mismatch'); if (!/^[a-f0-9]{64}$/.test(info.indexSha256)) throw new Error('index identity missing');"

      - name: Preserve legacy production shell as rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-publisher-web-legacy-production-rollback
          path: production-web
          if-no-files-found: error
          retention-days: 7

      - name: Archive exact Companion production artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-publisher-web-companion-production
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Chess-Publisher Web Companion artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish Chess-Publisher Web Companion
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
