name: Deploy Chess-Publisher Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Validate and build real Chess-Publisher Web app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          python -m pip install --disable-pip-version-check -r engine/gacrux/requirements.txt
          chmod +x bin/bbpPairings

      - name: Verify triggering commit checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: TypeScript check
        run: npm run lint

      - name: Online & Cloud beta4 regression
        run: npm run test:online-cloud

      - name: Online & Cloud beta5 Browser Continuation regression
        run: npm run test:online-cloud-beta5

      - name: Desktop-Web Cloud roundtrip regression
        run: npm run test:cloud-roundtrip

      - name: Production Web beta7 regression
        run: npm run test:production-web-beta7

      - name: Recovered browser function regression
        run: npm run test:recovered-web-functions

      - name: Architecture regression
        shell: bash
        env:
          GACRUX_PATH: ${{ github.workspace }}/engine/gacrux/pairingchecker.py
          BBP_PATH: ${{ github.workspace }}/bin/bbpPairings
        run: |
          set -euo pipefail
          npm run dev > "$RUNNER_TEMP/chess-publisher-test-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              cat "$RUNNER_TEMP/chess-publisher-test-server.log"
              exit 1
            fi
            sleep 1
          done
          npm run test:arch

      - name: Desktop-Web pairing parity regression
        env:
          GACRUX_PATH: ${{ github.workspace }}/engine/gacrux/pairingchecker.py
          BBP_PATH: ${{ github.workspace }}/bin/bbpPairings
        run: npm run test:parity

      - name: Transaction regression
        run: npm run test:transactions

      - name: Round finalization regression
        run: npm run test:finalization

      - name: FIDE regression
        run: npm run test:fide

      - name: Build existing Web test target for regression validation
        run: npm run build

      - name: Assemble canonical production-web artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f production-web/index.html
          test -f production-web/CNAME
          test "$(cat production-web/CNAME)" = "web.chess-publisher.org"
          test -f production-web/web/browser-dev-host.js
          test -f production-web/web/linux-native-engine-adapter.js
          test -f production-web/web/player-registration-enhancements.js
          test -f production-web/web/chess-results-browser-adapter.js
          test -f production-web/web/tournament-setup-enhancements.js
          test -f production-web/hub/client/hub-snapshot.js
          test -f production-web/hub/client/hub-api-client.js
          test -f production-web/webview/HubAdapter.js
          test -f production-web/cloud/client/cloud-workspace-api.js
          test -f production-web/webview/CloudWorkspaceAdapter.js
          node -e "const { createHash } = require('node:crypto'); const { readFileSync } = require('node:fs'); const shell = readFileSync('production-web/index.html', 'utf8').replace(/<!-- cpProductionWeb .*?<\\/body>/s, '</body>'); const expected = 'f6427a3c2ade30ec2799bdbcbf69688a3247e969c6f03e82daf11901386f791a'; if (createHash('sha256').update(shell).digest('hex') !== expected) throw new Error('production-web/index.html is not the beta.6 desktop shell');"
          rm -rf dist
          mkdir -p dist
          cp -R production-web/. dist/

      - name: Write deployment identity
        shell: bash
        run: |
          set -euo pipefail
          node -e "const { createHash } = require('node:crypto'); const { readFileSync, writeFileSync } = require('node:fs'); const indexSha256 = createHash('sha256').update(readFileSync('dist/index.html')).digest('hex'); const buildInfo = { product: 'Chess-Publisher Web', source: 'production-web', deploymentSource: 'Exact desktop ChessPublisher.html production shell', repository: 'kbilyal/Chess-Publisher-Web', branch: 'main', commit: process.env.GITHUB_SHA, indexSha256, builtAt: new Date().toISOString() }; writeFileSync('dist/build-info.json', JSON.stringify(buildInfo, null, 2) + '\\n');"

      - name: Disable Jekyll processing and preserve SPA routes
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Verify exact production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/build-info.json
          test -f dist/CNAME
          test "$(cat dist/CNAME)" = "web.chess-publisher.org"
          test -f dist/web/browser-dev-host.js
          test -f dist/web/linux-native-engine-adapter.js
          test -f dist/web/player-registration-enhancements.js
          test -f dist/web/chess-results-browser-adapter.js
          test -f dist/web/tournament-setup-enhancements.js
          test -f dist/hub/client/hub-snapshot.js
          test -f dist/hub/client/hub-api-client.js
          test -f dist/webview/HubAdapter.js
          test -f dist/cloud/client/cloud-workspace-api.js
          test -f dist/webview/CloudWorkspaceAdapter.js
          grep -q 'cpProductionWeb' dist/index.html
          grep -q 'cpLinuxWebDev' dist/index.html
          grep -q 'Chess-Publisher' dist/index.html
          grep -q 'Online & Cloud' dist/index.html
          grep -q 'Pull Changes' dist/index.html
          grep -q 'Sync Now' dist/index.html
          ! grep -Eq 'assets/index-[^" ]+\.(js|css)' dist/index.html
          ! grep -q 'vite/client' dist/index.html
          ! grep -q 'src/main.tsx' dist/index.html
          node -e "const { readFileSync } = require('node:fs'); const info = JSON.parse(readFileSync('dist/build-info.json', 'utf8')); if (info.commit !== process.env.GITHUB_SHA) throw new Error('build-info commit does not match GITHUB_SHA'); if (info.repository !== 'kbilyal/Chess-Publisher-Web') throw new Error('build-info repository mismatch'); if (info.branch !== 'main') throw new Error('build-info branch mismatch'); if (info.source !== 'production-web') throw new Error('production source identity mismatch'); if (info.deploymentSource !== 'Exact desktop ChessPublisher.html production shell') throw new Error('desktop shell identity mismatch'); if (!/^[a-f0-9]{64}$/.test(info.indexSha256)) throw new Error('production index identity missing');"
          find dist -maxdepth 4 -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact Chess-Publisher Web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publish real Chess-Publisher Web program
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
