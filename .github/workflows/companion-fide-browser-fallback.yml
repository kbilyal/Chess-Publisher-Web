name: Companion browser FIDE fallback gate
on:
  pull_request:
    paths:
      - 'src/companion/CompanionRegistration.tsx'
      - 'src/companion/fideBrowserDatabase.ts'
      - 'src/server/fide/transliteration.ts'
      - 'data/fide/fide_ratings.sqlite'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/companion-fide-browser-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-fide-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build Companion and verify production FIDE assets
        run: |
          set -euo pipefail
          npm run build
          test -s dist/fide/fide_ratings.sqlite
          test -s dist/vendor/sql-wasm.wasm
          test "$(stat -c%s dist/fide/fide_ratings.sqlite)" -gt 1000000
          test "$(stat -c%s dist/vendor/sql-wasm.wasm)" -gt 100000
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare isolated registration preview with static FIDE assets
        run: |
          set -euo pipefail
          mkdir -p public/fide public/vendor
          cp data/fide/fide_ratings.sqlite public/fide/fide_ratings.sqlite
          cp node_modules/sql.js/dist/sql-wasm.wasm public/vendor/sql-wasm.wasm
          cat > preview-fide.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FIDE fallback preview</title></head>
            <body><div id="root"></div><script type="module" src="/preview-fide.tsx"></script></body>
          </html>
          EOF
          cat > preview-fide.tsx <<'EOF'
          import React, { useState } from 'react';
          import { createRoot } from 'react-dom/client';
          import { CompanionRegistration } from './src/companion/CompanionRegistration.tsx';
          import { createInitialEmptyTournament } from './src/data/initialData.ts';
          import './src/index.css';
          import './src/companion.css';
          import './src/companion-registration.css';

          function Preview() {
            const [tournament, setTournament] = useState<any>(() => {
              const next: any = createInitialEmptyTournament('FIDE Browser Fallback');
              next.settings.tournamentRatingType = 'Standard';
              next.players = [];
              return next;
            });
            return <CompanionRegistration tournament={tournament} onUpdateTournament={updater => setTournament((previous: any) => updater(previous))} />;
          }
          createRoot(document.getElementById('root')!).render(<Preview />);
          EOF
      - name: Start Vite browser target
        run: |
          npx vite --host 127.0.0.1 --port 4176 > /tmp/cp-fide-vite.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:4176/preview-fide.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cp-fide-vite.log
          exit 1
      - name: Force API failure and verify browser SQLite fallback
        run: |
          mkdir -p companion-fide-preview
          cat > verify-fide-fallback.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          for (const viewport of [{ width: 1280, height: 800 }, { width: 390, height: 844 }]) {
            const page = await browser.newPage({ viewport });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));
            await page.route('**/api/fide/search**', route => route.fulfill({ status: 503, contentType: 'application/json', body: JSON.stringify({ error: 'forced_for_fallback_test' }) }));
            await page.goto('http://127.0.0.1:4176/preview-fide.html', { waitUntil: 'networkidle' });
            await page.getByPlaceholder('Name or FIDE ID').fill('Carlsen');
            await page.locator('.companion-fide-row').first().waitFor({ state: 'visible', timeout: 15000 });
            const count = await page.locator('.companion-fide-row').count();
            if (count < 1) throw new Error(`No static FIDE results at ${viewport.width}px.`);
            const notice = page.locator('.companion-registration-notice');
            await notice.getByText(/locally cached official rating database/i).waitFor({ state: 'visible', timeout: 5000 });
            const firstText = await page.locator('.companion-fide-row').first().innerText();
            if (!/Carlsen/i.test(firstText)) throw new Error(`Unexpected FIDE fallback result: ${firstText}`);
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            if (overflow > 1) throw new Error(`FIDE fallback UI overflow ${overflow}px at ${viewport.width}px.`);
            if (pageErrors.length) throw new Error(pageErrors.join('\n'));
            await page.screenshot({ path: `companion-fide-preview/fide-fallback-${viewport.width}.png`, fullPage: true });
            await page.close();
          }
          await browser.close();
          EOF
          node verify-fide-fallback.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: companion-fide-browser-fallback-preview
          path: companion-fide-preview/*.png
          if-no-files-found: error
          retention-days: 7
