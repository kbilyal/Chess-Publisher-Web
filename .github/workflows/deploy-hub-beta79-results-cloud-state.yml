name: Deploy beta.79 Arbiter Results Cloud State

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/patch-arbiter-results-cloud-state-worker.py'
      - '.github/workflows/deploy-hub-beta79-results-cloud-state.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUB_WORKER_NAME: chess-publisher-hub-api-beta
  HUB_PUBLIC_BASE: https://chess-publisher-hub-api-beta.kyamranbilyal.workers.dev

jobs:
  deploy:
    name: Commit Arbiter results to private tournament revisions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Recover exact live protected Hub Worker
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hub-beta79-results"
          mkdir -p "$work"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl --fail --silent --show-error --location -H "$auth" "$api" -o "$work/live-worker.multipart"
          curl --fail --silent --show-error -H "$auth" "$api/deployments" -o "$work/deployments-before.json"

          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib, json, os

          work = Path(os.environ['RUNNER_TEMP']) / 'hub-beta79-results'
          raw = (work / 'live-worker.multipart').read_bytes()
          first = raw.splitlines()[0].decode('ascii', 'strict')
          if not first.startswith('--'):
              raise SystemExit('Unexpected Hub Worker download format.')
          boundary = first[2:]
          envelope = (f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n').encode() + raw
          msg = BytesParser(policy=default).parsebytes(envelope)
          parts = list(msg.iter_parts())
          if len(parts) != 1:
              raise SystemExit(f'Expected one Worker module, got {len(parts)}.')
          payload = parts[0].get_payload(decode=True) or b''
          source = payload.decode('utf-8', 'strict')
          required = [
              'export default',
              'private_cloud_archive_v1',
              'private_cloud_hard_delete_v1',
              'arbiter_access_v1',
              'arbiter_snapshot_b2_v1',
              'arbiter_special_results_v1',
              'arbiter_results_ack_guard_v1',
              'submitArbiterResult',
              'acknowledgeOrganizerArbiterResults',
              'b2UploadJson',
              'cloud_revisions',
              'cloudTournamentForOrganizer'
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit(f'Refusing unexpected Hub Worker baseline; missing: {missing}')
          state = 'beta79' if 'arbiter_results_cloud_state_v1' in source else 'pre_beta79'
          (work / 'worker.original.js').write_bytes(payload)
          (work / 'worker.js').write_bytes(payload)
          sha = hashlib.sha256(payload).hexdigest()

          deployments = json.loads((work / 'deployments-before.json').read_text())
          rows = (deployments.get('result') or {}).get('deployments') or []
          if not rows:
              raise SystemExit('No active Hub deployment was returned by Cloudflare.')
          versions = rows[0].get('versions') or []
          if len(versions) != 1 or float(versions[0].get('percentage') or 0) != 100:
              raise SystemExit('Expected one 100% active Hub Worker version.')
          previous_version = str(versions[0].get('version_id') or '')
          if not previous_version:
              raise SystemExit('Active Hub deployment has no version id.')

          print(f'Current live SHA256: {sha}')
          print(f'Current beta.79 result state: {state}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'source_state={state}\n')
              out.write(f'previous_version_id={previous_version}\n')
          PY

      - name: Apply beta.79 Cloud-state result upgrade
        if: steps.inspect.outputs.source_state == 'pre_beta79'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/patch-arbiter-results-cloud-state-worker.py
          python scripts/patch-arbiter-results-cloud-state-worker.py "$RUNNER_TEMP/hub-beta79-results/worker.js"

      - name: Verify protected Worker source
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          worker="$RUNNER_TEMP/hub-beta79-results/worker.js"
          node --check "$worker"
          grep -Fq 'private_cloud_hard_delete_v1' "$worker"
          grep -Fq 'arbiter_access_v1' "$worker"
          grep -Fq 'arbiter_snapshot_b2_v1' "$worker"
          grep -Fq 'arbiter_special_results_v1' "$worker"
          grep -Fq 'arbiter_results_ack_guard_v1' "$worker"
          grep -Fq 'arbiter_results_cloud_state_v1' "$worker"
          grep -Fq 'board.result = result' "$worker"
          grep -Fq 'validateCloudSnapshot(snapshot)' "$worker"
          grep -Fq 'b2UploadJson(env, objectKey, bytes)' "$worker"
          grep -Fq 'INSERT INTO cloud_revisions' "$worker"
          grep -Fq "'arbiter-result'" "$worker"
          grep -Fq 'UPDATE cloud_tournaments' "$worker"
          grep -Fq 'cloud_arbiter_results' "$worker"
          grep -Fq 'acknowledgeOrganizerArbiterResults' "$worker"
          grep -Fq 'DELETE FROM cloud_tournaments' "$worker"
          sha="$(sha256sum "$worker" | awk '{print $1}')"
          echo "Target Hub SHA256: $sha"
          echo "target_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload protected Worker content when changed
        id: upload
        if: steps.inspect.outputs.source_state == 'pre_beta79'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hub-beta79-results"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}/content"
          status="$(curl --silent --show-error \
            --output "$work/content-update.json" \
            --write-out '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F "worker.js=@${work}/worker.js;type=application/javascript+module" \
            "$endpoint")"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat "$work/content-update.json"
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Verify live protected routes
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hub-beta79-results"
          ready=false
          for attempt in $(seq 1 30); do
            health="$(curl --silent --show-error --output "$work/health.json" --write-out '%{http_code}' "$HUB_PUBLIC_BASE/api/v1/health")"
            cloud="$(curl --silent --show-error --output "$work/cloud.json" --write-out '%{http_code}' "$HUB_PUBLIC_BASE/api/v1/cloud/tournaments")"
            tournament="$(curl --silent --show-error --output "$work/tournament.json" --write-out '%{http_code}' "$HUB_PUBLIC_BASE/api/v1/arbiter/tournament")"
            result="$(curl --silent --show-error --output "$work/result.json" --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$HUB_PUBLIC_BASE/api/v1/arbiter/results")"
            if [ "$health" = '200' ] && [ "$cloud" = '401' ] && [ "$tournament" = '401' ] && [ "$result" = '401' ]; then
              ready=true
              break
            fi
            echo "Waiting for protected route propagation: health=$health cloud=$cloud tournament=$tournament result=$result"
            sleep 3
          done
          test "$ready" = true
          echo 'BETA79_ARBITER_RESULTS_LIVE_SMOKE=PASS'

      - name: Verify exact live Worker content
        shell: bash
        env:
          TARGET_SHA: ${{ steps.verify.outputs.target_sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hub-beta79-results/live-check"
          mkdir -p "$work"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" -o "$work/live.multipart"
          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib, os

          work = Path(os.environ['RUNNER_TEMP']) / 'hub-beta79-results' / 'live-check'
          raw = (work / 'live.multipart').read_bytes()
          boundary = raw.splitlines()[0].decode()[2:]
          envelope = (f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n').encode() + raw
          msg = BytesParser(policy=default).parsebytes(envelope)
          parts = list(msg.iter_parts())
          if len(parts) != 1:
              raise SystemExit('Unexpected live Worker module count.')
          payload = parts[0].get_payload(decode=True) or b''
          actual = hashlib.sha256(payload).hexdigest()
          expected = os.environ['TARGET_SHA']
          print(f'Live Hub SHA256: {actual}')
          if actual != expected:
              raise SystemExit(f'Live Hub content mismatch: expected {expected}, got {actual}')
          for marker in [
              b'private_cloud_hard_delete_v1',
              b'arbiter_access_v1',
              b'arbiter_special_results_v1',
              b'arbiter_results_ack_guard_v1',
              b'arbiter_results_cloud_state_v1'
          ]:
              if marker not in payload:
                  raise SystemExit(f'Live Worker is missing required marker: {marker!r}')
          PY

      - name: Roll back previous Worker version if verification fails
        if: failure() && steps.upload.outputs.changed == 'true'
        shell: bash
        env:
          PREVIOUS_VERSION: ${{ steps.inspect.outputs.previous_version_id }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hub-beta79-results"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}/deployments?force=true"
          python - <<'PY' > "$work/rollback-body.json"
          import json, os
          print(json.dumps({
            'strategy': 'percentage',
            'versions': [{'percentage': 100, 'version_id': os.environ['PREVIOUS_VERSION']}],
            'annotations': {'workers/message': 'Automatic rollback after beta.79 Arbiter result-state verification failure'}
          }))
          PY
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "@$work/rollback-body.json" \
            "$endpoint" >/dev/null
          echo 'Previous active Hub Worker version restored.'
