name: One-time Fix Publish Tab State

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-publish-tab-state.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply exact Publish UI-state fix and regression guard
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          provider_path = Path('src/cloud/OnlineCloudProviderV2.tsx')
          provider = provider_path.read_text()
          old = """        setPublicState(tournament.online);\n        commitLocal(tournament, true);\n        setStatus(`Published Online · r${tournament.online.revision}`);"""
          new = """        setPublicState(tournament.online);\n        // Publishing updates persisted Hub metadata but must not remount the\n        // Companion workspace: remounting resets the active Publish tab to Setup.\n        commitLocal(tournament, false);\n        setStatus(`Published Online · r${tournament.online.revision}`);"""
          if provider.count(old) != 1:
              raise SystemExit('Expected exactly one Publish Online remount marker.')
          provider_path.write_text(provider.replace(old, new, 1))

          test_path = Path('tests/ui/hub-companion-v1.test.mjs')
          test = test_path.read_text()
          source_anchor = "const cloudActions = fs.readFileSync('src/companion/companionCloudActions.ts', 'utf8');\n"
          source_insert = source_anchor + "const cloudProvider = fs.readFileSync('src/cloud/OnlineCloudProviderV2.tsx', 'utf8');\n"
          if "const cloudProvider = fs.readFileSync('src/cloud/OnlineCloudProviderV2.tsx', 'utf8');" not in test:
              if source_anchor not in test:
                  raise SystemExit('Companion contract source anchor changed.')
              test = test.replace(source_anchor, source_insert, 1)

          assertion_anchor = "has(workspace, 'const synchronized = adoptSynchronizedTournament()', 'Online Hub must publish the synchronized Desktop/Cloud tournament revision.');\n"
          assertions = assertion_anchor + "\nconst publishOnlineBody = cloudProvider.split('async function publishOnline(tournamentInput: Tournament) {', 2)[1]?.split('function openPublicPage', 1)[0] || '';\nhas(publishOnlineBody, 'commitLocal(tournament, false)', 'Successful Online Hub publish must persist metadata without remounting the Companion workspace.');\nlacks(publishOnlineBody, 'commitLocal(tournament, true)', 'Online Hub publish must not remount the workspace and reset Publish back to Setup.');\n"
          if "Online Hub publish must not remount the workspace and reset Publish back to Setup." not in test:
              if assertion_anchor not in test:
                  raise SystemExit('Publish contract assertion anchor changed.')
              test = test.replace(assertion_anchor, assertions, 1)
          test_path.write_text(test)
          PY

      - name: Verify focused regression and TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node tests/ui/hub-companion-v1.test.mjs
          npm run typecheck

      - name: Commit exact fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'kbilyal'
          git config user.email '65768770+kbilyal@users.noreply.github.com'
          git rm .github/workflows/fix-publish-tab-state.yml
          git add src/cloud/OnlineCloudProviderV2.tsx tests/ui/hub-companion-v1.test.mjs
          git commit -m 'Keep Publish workspace active after Hub publication'
          git push origin HEAD:main
