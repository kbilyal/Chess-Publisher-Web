name: Apply Desktop Sync Control Panel

on:
  push:
    branches: [main]
    paths:
      - docs/deploy-markers/desktop-sync-control-panel-trigger.md

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        run: python scripts/apply-desktop-sync-control-panel.py
      - name: Validate
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          node tests/ui/hub-companion-v1.test.mjs
          npm run test:online-cloud
          npm run test:online-cloud-beta5
          npm run test:cloud-roundtrip
          npm run test:desktop-beta34-web-parity
          npm run test:chess-results-companion
          npm run test:chess-results
          npm run test:trf
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/companion/companionCloudActions.ts src/cloud/OnlineCloudTabV2.tsx src/cloud/tests/runDirectionalDesktopParityTests.ts
          git diff --cached --quiet && exit 0
          git commit -m "Add explicit Desktop Cloud status and conflict controls"
          git push origin HEAD:main
