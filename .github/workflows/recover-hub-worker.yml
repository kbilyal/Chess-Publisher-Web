name: Recover Hub Worker Source (Encrypted)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/recover-hub-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUB_WORKER_NAME: chess-publisher-hub-api-beta

jobs:
  recover:
    name: Export current Hub Worker without exposing plaintext
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Export current Worker script and metadata
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/hub-worker-recovery"
          mkdir -p "$work/plain"
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          auth="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          curl --fail --silent --show-error --location \
            -H "$auth" \
            "$base" \
            -o "$work/plain/worker-content.bin"

          curl --fail --silent --show-error \
            -H "$auth" \
            "$base/script-settings" \
            -o "$work/plain/script-settings.json"

          curl --fail --silent --show-error \
            -H "$auth" \
            "$base/deployments" \
            -o "$work/plain/deployments.json"

          file "$work/plain/worker-content.bin" > "$work/plain/content-type.txt"
          tar -C "$work/plain" -czf "$work/hub-worker-recovery.tar.gz" .

      - name: Encrypt recovered Worker bundle for this repair session
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hub-worker-recovery"
          cat > "$work/recovery-cert.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEHTCCAoWgAwIBAgIUAxBo6pnKO4GdIfcnr/taVb2IzdYwDQYJKoZIhvcNAQEL
          BQAwHjEcMBoGA1UEAwwTaHViLXdvcmtlci1yZWNvdmVyeTAeFw0yNjA5MDgwNzI4
