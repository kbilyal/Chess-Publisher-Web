          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$work/hub-worker-recovery.tar.gz" \
            -out "$work/hub-worker-recovery.cms" \
            -outform DER \
            "$work/recovery-cert.pem"

          rm -rf "$work/plain" "$work/hub-worker-recovery.tar.gz" "$work/recovery-cert.pem"
          test -s "$work/hub-worker-recovery.cms"

      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-worker-recovery-encrypted
          path: ${{ runner.temp }}/hub-worker-recovery/hub-worker-recovery.cms
          if-no-files-found: error
          retention-days: 1
