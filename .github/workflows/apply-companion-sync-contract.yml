name: Apply Companion Sync Contract Repair

on:
  push:
    branches: [main]
    paths:
      - docs/deploy-markers/companion-sync-contract-trigger.md

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        run: python scripts/repair-companion-sync-contract.py
      - name: Validate targeted regressions
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run test:cloud-roundtrip
          npm run test:online-cloud-beta5
          npm run test:chess-results-companion
          npm run test:chess-results
          npm run test:player-parity
          npm run test:trf
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud/onlineCloudSync.ts src/companion/CompanionSetup.tsx src/companion/CompanionRegistration.tsx src/companion-registration.css src/companion/companionCloudActions.ts src/companion/CompanionWorkspace.tsx src/cloud/tests/runCompanionSyncContractTests.ts package.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix Desktop-Web tournament sync and explicit Pull Push"
          git push origin HEAD:main
