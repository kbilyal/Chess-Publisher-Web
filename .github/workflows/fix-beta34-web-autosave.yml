name: Fix beta34 Web autosave revision guard

on:
  push:
    branches:
      - align/desktop-beta34-web-parity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout parity branch
        uses: actions/checkout@v4
        with:
          ref: align/desktop-beta34-web-parity
          fetch-depth: 0

      - name: Apply Web-only autosave revision guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum production-web/index.html | awk '{print $1}')" = "a8e0571339b311e7b97009dc783e1f0be0cc08f118321998d1dfbf764100acd9"
          test "$(sha256sum production-web/web/chess-results-browser-adapter.js | awk '{print $1}')" = "6d313e9f6ef3d0fc313f8ca1df3fee5d0b862f51d808ba9fd94bb3605735d3fa"
          test "$(sha256sum production-web/hub/client/hub-api-client.js | awk '{print $1}')" = "2311446a69c16a14e041dbf08d4e198280d3a3f1232b739bf8e089d8ffdac9f0"
          test "$(sha256sum production-web/hub/client/hub-snapshot.js | awk '{print $1}')" = "d980c520d74a71e66b3a3aa2a54e5ed626ea3618c53159145f9e48b445effac9"
          test "$(sha256sum production-web/webview/HubAdapter.js | awk '{print $1}')" = "5477080af2e9dce1dcb25b622bf4aa8e77bc977a2f60759d175e6a8464bf8348"
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          index_path = Path('production-web/index.html')
          text = index_path.read_text(encoding='utf-8')
          old = 'function saveData(){   cpStateRevision++;'
          new = 'function saveData(){   if(!cpAutosaveCaptureSync) cpStateRevision++;'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one unguarded saveData revision increment, found {text.count(old)}')
          text = text.replace(old, new, 1)
          index_path.write_text(text, encoding='utf-8')

          shell = re.sub(r'<!-- cpProductionWeb .*?</body>', '</body>', text, count=1, flags=re.S)
          shell_sha = hashlib.sha256(shell.encode('utf-8')).hexdigest()
          test_path = Path('src/cloud/tests/runProductionWebBeta7Tests.ts')
          test = test_path.read_text(encoding='utf-8')
          test, count = re.subn(r'const expectedShell = "[a-f0-9]{64}";', f'const expectedShell = "{shell_sha}";', test, count=1)
          if count != 1:
              raise SystemExit('could not update beta7 shell checksum')
          test_path.write_text(test, encoding='utf-8')
          print(f'guarded_shell_sha256={shell_sha}')
          PY
          grep -q 'function saveData(){   if(!cpAutosaveCaptureSync) cpStateRevision++;' production-web/index.html
          test "$(sha256sum production-web/web/chess-results-browser-adapter.js | awk '{print $1}')" = "6d313e9f6ef3d0fc313f8ca1df3fee5d0b862f51d808ba9fd94bb3605735d3fa"
          test "$(sha256sum production-web/hub/client/hub-api-client.js | awk '{print $1}')" = "2311446a69c16a14e041dbf08d4e198280d3a3f1232b739bf8e089d8ffdac9f0"
          test "$(sha256sum production-web/hub/client/hub-snapshot.js | awk '{print $1}')" = "d980c520d74a71e66b3a3aa2a54e5ed626ea3618c53159145f9e48b445effac9"
          test "$(sha256sum production-web/webview/HubAdapter.js | awk '{print $1}')" = "5477080af2e9dce1dcb25b622bf4aa8e77bc977a2f60759d175e6a8464bf8348"

      - name: Validate guarded candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:production-web-beta7
          npm run test:desktop-beta34-web-parity
          npm run test:cloud-roundtrip
          npm run lint

      - name: Commit guarded candidate only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-beta34-web-autosave.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production-web/index.html src/cloud/tests/runProductionWebBeta7Tests.ts .github/workflows/fix-beta34-web-autosave.yml
          git commit -m "Preserve Web autosave revision guard on beta34 shell"
          git push origin HEAD:align/desktop-beta34-web-parity
