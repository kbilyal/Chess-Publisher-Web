name: Audit beta.79 live Worker

on:
  push:
    branches:
      - audit-beta79-live-worker
    paths:
      - '.github/workflows/audit-beta79-live-worker.yml'

permissions:
  contents: read

env:
  HUB_WORKER_NAME: chess-publisher-hub-api-beta

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover live Worker and print safe contract excerpts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" -o "$RUNNER_TEMP/live.multipart"
          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import re, hashlib, os
          raw = Path(os.environ['RUNNER_TEMP'], 'live.multipart').read_bytes()
          boundary = raw.splitlines()[0].decode('ascii', 'strict')[2:]
          envelope = (f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n').encode() + raw
          msg = BytesParser(policy=default).parsebytes(envelope)
          parts = list(msg.iter_parts())
          if len(parts) != 1: raise SystemExit(f'unexpected module count {len(parts)}')
          src = (parts[0].get_payload(decode=True) or b'').decode('utf-8', 'strict')
          print('LIVE_SHA256=' + hashlib.sha256(src.encode()).hexdigest())
          targets=['submitArbiterResult','acknowledgeOrganizerArbiterResults','buildRestrictedArbiterTournament','arbiterSnapshotObject','putCloudSnapshot']
          for target in targets:
            m=re.search(r'(?:async\s+)?function\s+'+re.escape(target)+r'\s*\([^)]*\)\s*\{',src)
            if not m: continue
            start=m.start(); depth=0; end=None
            for i in range(m.end()-1,len(src)):
              c=src[i]
              if c=='{': depth+=1
              elif c=='}':
                depth-=1
                if depth==0:
                  end=i+1; break
            if end:
              print('---BEGIN '+target+'---')
              print(src[start:end][:30000])
              print('---END '+target+'---')
          for marker in ['arbiter_access_v1','arbiter_snapshot_b2_v1','arbiter_special_results_v1','arbiter_results_ack_guard_v1']:
            print(f'MARKER {marker}=' + ('YES' if marker in src else 'NO'))
          PY
