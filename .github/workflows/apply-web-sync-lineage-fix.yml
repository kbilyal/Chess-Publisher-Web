name: Apply Web Sync Lineage Fix

on:
  push:
    branches:
      - fix/unified-sync-phantom-conflict
    paths:
      - 'scripts/apply-web-sync-lineage-fix.py'
      - '.github/workflows/apply-web-sync-lineage-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-sync-phantom-conflict
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact patch
        run: python scripts/apply-web-sync-lineage-fix.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud/onlineCloudSync.ts src/cloud/OnlineCloudProviderV2.tsx src/companion/CompanionWorkspace.tsx src/arbiter/ArbiterPortal.tsx src/arbiter/installArbiterResultFilters.ts
          git diff --cached --check
          git commit -m "Fix unified SYNC lineage and consolidate Web SYNC actions"
          git push origin HEAD:fix/unified-sync-phantom-conflict
