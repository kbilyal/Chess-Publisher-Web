name: Apply Web Sync Lineage Fix

on:
  push:
    branches:
      - fix/unified-sync-phantom-conflict
    paths:
      - 'scripts/apply-web-sync-lineage-fix.py'
      - 'scripts/apply-web-sync-lineage-ui-tail-fix.py'
      - 'scripts/apply-web-sync-portable-snapshot-fix.py'
      - 'scripts/apply-unified-sync-final-cleanup.py'
      - '.github/workflows/apply-web-sync-lineage-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-sync-phantom-conflict
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'PORTABLE_FINGERPRINT_SCHEMA = 6' src/cloud/onlineCloudSync.ts; then
            python scripts/apply-web-sync-lineage-fix.py
          fi
          if grep -q 'Pull latest Cloud → Web' src/companion/CompanionWorkspace.tsx; then
            python scripts/apply-web-sync-lineage-ui-tail-fix.py
          fi
          python scripts/apply-web-sync-portable-snapshot-fix.py
          python scripts/apply-unified-sync-final-cleanup.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/cloud/onlineCloudSync.ts src/cloud/OnlineCloudProviderV2.tsx src/companion/CompanionWorkspace.tsx src/arbiter/ArbiterPortal.tsx src/arbiter/installArbiterResultFilters.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m "Finish unified SYNC content contract cleanup"
          git push origin HEAD:fix/unified-sync-phantom-conflict
