name: Apply Publication Player Order Patch

on:
  push:
    branches:
      - feat/publication-player-order-20260911
    paths:
      - 'scripts/apply-publication-player-order.py'
      - '.github/workflows/apply-publication-player-order.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/publication-player-order-20260911
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply strict point patch
        run: python3 scripts/apply-publication-player-order.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Cloud and publication regressions
        run: npm run test:cloud-roundtrip
      - name: Chess-Results regressions
        run: npm run test:chess-results
      - name: Commit exact patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/companion/CompanionRegistration.tsx src/chessResults/publication.ts src/cloud/publicHubSnapshot.ts
          git diff --cached --check
          git commit -m 'Apply publication player ordering to Hub and Chess-Results'
          git push origin HEAD:feat/publication-player-order-20260911
