name: Apply Web Create Import Tournament

on:
  push:
    branches: [main]
    paths:
      - docs/deploy-markers/web-create-import-tournament-trigger.md

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install TUNX parser
        run: npm install @echecs/tunx@1.0.1 --save --no-audit --no-fund
      - name: Apply create/import implementation
        run: |
          python scripts/apply-web-create-import-tournament.py
          python scripts/patch-web-create-import-tests.py
          python scripts/patch-public-hub-bye-normalization.py
      - name: Validate create/import and protected cores
        env:
          GACRUX_PATH: ${{ github.workspace }}/engine/gacrux/pairingchecker.py
          BBP_PATH: ${{ github.workspace }}/bin/bbpPairings
        run: |
          set -euo pipefail
          npm run lint
          npm run test:tournament-import
          node tests/ui/companion-cloud-screens.test.mjs
          node tests/ui/hub-companion-v1.test.mjs
          npm run test:online-cloud
          npm run test:online-cloud-beta5
          npm run test:cloud-roundtrip
          npm run test:desktop-beta34-web-parity
          npm run test:transactions
          npm run test:finalization
          npm run test:fide
          npm run test:trf
          npm run test:chess-results
          npm run test:chess-results-companion
          npm run test:parity
          npm run build
      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/importers/tournamentFileImport.ts src/companion/CompanionCloudScreens.tsx src/companion-cloud.css src/cloud/OnlineCloudProviderV2.tsx src/cloud/publicHubSnapshot.ts src/cloud/tests/runTournamentCreateImportTests.ts tests/ui/companion-cloud-screens.test.mjs tests/ui/hub-companion-v1.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Add Web tournament creation and TRF TUNX import"
          git push origin HEAD:main
