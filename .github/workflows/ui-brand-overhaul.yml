name: UI preservation and Hub Companion gate
on:
  pull_request:
    paths:
      - 'production-web/index.html'
      - 'production-web/web/brand-overhaul.css'
      - 'production-web/web/ui-v6-production.css'
      - 'production-web/web/ui-v6-cascade-lock.css'
      - 'production-web/web/ui-v6-production.js'
      - 'production-web/web/cloud-tournaments-shortcut.js'
      - 'src/App.tsx'
      - 'src/companion/**'
      - 'src/components/Header.tsx'
      - 'src/index.css'
      - 'src/companion.css'
      - 'src/companion-publish-v2.css'
      - 'src/companion-registration.css'
      - 'src/companion-setup.css'
      - 'src/main.tsx'
      - 'src/cloud/**'
      - 'src/chessResults/**'
      - 'tests/ui/**'
      - '.github/workflows/ui-brand-overhaul.yml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      # The currently deployed legacy production artifact remains byte/regression
      # protected until the Companion deployment switch is explicitly approved.
      - run: node tests/ui/brand-overhaul.test.mjs
      - run: node tests/ui/full-overhaul-v2.test.mjs
      - run: node tests/ui/masterpiece-v3.test.mjs
      - run: node tests/ui/stable-reliable-v5.test.mjs
      - run: node tests/ui/production-v6-deployment.test.mjs
      - run: node tests/ui/login-screen-persistence.test.mjs

      # The root React app is intentionally no longer UI v6. Its replacement
      # contract is the focused Hub-first Companion gate below.
      - run: node tests/ui/hub-companion-v1.test.mjs

      - run: npm run lint
      - run: npm run build
      - run: npm run test:production-web-beta7
      - run: npm run test:desktop-beta34-web-parity
      - run: npm run test:cloud-roundtrip
      - run: npm run test:chess-results-web-contract
