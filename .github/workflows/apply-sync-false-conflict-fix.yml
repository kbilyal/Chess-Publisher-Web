name: Apply Sync False Conflict Fix

# Retry after separating automatic-sync and pull base-reconstruction anchors.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sync-false-conflict-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply false-conflict repair
        run: python scripts/apply-sync-false-conflict-fix.py
      - name: Validate directional sync and protected cores
        shell: bash
        run: |
          set -euo pipefail
          npm run lint
          npm run test:cloud-roundtrip
          npm run test:online-cloud
          npm run test:online-cloud-beta5
          npm run test:desktop-beta34-web-parity
          npm run test:chess-results-companion
          npm run test:chess-results
          npm run test:trf
          node tests/ui/companion-cloud-screens.test.mjs
          node tests/ui/hub-companion-v1.test.mjs
          npm run build
      - name: Commit validated implementation and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-sync-false-conflict-fix.yml scripts/apply-sync-false-conflict-fix.py
          git add src/cloud/OnlineCloudProviderV2.tsx src/companion/companionCloudActions.ts src/cloud/tests/runCompanionSyncContractTests.ts
          git commit -m "Fix false Desktop Web sync conflicts after local edits"
          git push origin HEAD:main
