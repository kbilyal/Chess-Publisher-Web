name: Audit Live Cloud Sync Lineage

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUB_WORKER_NAME: chess-publisher-hub-api-beta

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Recover exact live Worker and audit sync write paths
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/sync-lineage-audit"
          mkdir -p "$work"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" -o "$work/live.multipart"
          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib, os, re

          work=Path(os.environ['RUNNER_TEMP'])/'sync-lineage-audit'
          raw=(work/'live.multipart').read_bytes()
          boundary=raw.splitlines()[0].decode('ascii','strict')[2:]
          envelope=(f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw
          msg=BytesParser(policy=default).parsebytes(envelope)
          parts=list(msg.iter_parts())
          if len(parts)!=1: raise SystemExit(f'Unexpected module count: {len(parts)}')
          payload=parts[0].get_payload(decode=True) or b''
          src=payload.decode('utf-8','strict')
          (work/'worker.js').write_bytes(payload)
          print('LIVE_SHA256='+hashlib.sha256(payload).hexdigest())
          markers=['private_cloud_archive_v1','private_cloud_hard_delete_v1','arbiter_access_v1','arbiter_special_results_v1']
          print('MARKERS='+','.join(m for m in markers if m in src))

          funcs=[]
          for name in re.findall(r'async function ([A-Za-z0-9_]+)\s*\(',src):
              low=name.lower()
              if any(k in low for k in ['cloud','snapshot','tournament','arbiter','revision']): funcs.append(name)
          print('SYNC_FUNCTIONS='+','.join(sorted(set(funcs))))

          def body(name):
              m=re.search(r'async function '+re.escape(name)+r'\s*\([^)]*\)\s*\{',src)
              if not m:return ''
              i=m.end(); depth=1; j=i
              in_s=in_d=in_t=False; esc=False
              while j<len(src) and depth:
                  ch=src[j]
                  if esc: esc=False; j+=1; continue
                  if ch=='\\' and (in_s or in_d or in_t): esc=True; j+=1; continue
                  if not in_d and not in_t and ch=="'": in_s=not in_s; j+=1; continue
                  if not in_s and not in_t and ch=='"': in_d=not in_d; j+=1; continue
                  if not in_s and not in_d and ch=='`': in_t=not in_t; j+=1; continue
                  if not (in_s or in_d or in_t):
                      if ch=='{': depth+=1
                      elif ch=='}': depth-=1
                  j+=1
              return src[m.start():j]

          targets=[n for n in funcs if any(k in n.lower() for k in ['snapshot','tournament','arbiterresult','arbiter_result'])]
          for n in sorted(set(targets)):
              b=body(n)
              if not b: continue
              evidence=[]
              if re.search(r'UPDATE\s+cloud_tournaments',b,re.I): evidence.append('UPDATE_cloud_tournaments')
              if re.search(r'INSERT\s+INTO\s+cloud_[A-Za-z0-9_]*revision',b,re.I): evidence.append('INSERT_revision')
              if re.search(r'current_revision\s*\+\s*1|revision\s*\+\s*1|nextRevision',b,re.I): evidence.append('REV_INCREMENT')
              if re.search(r'\.put\s*\(',b): evidence.append('OBJECT_PUT')
              if re.search(r'\.get\s*\(',b): evidence.append('OBJECT_GET')
              if re.search(r'updated_at',b,re.I): evidence.append('UPDATED_AT')
              if evidence: print('FUNC '+n+':'+','.join(evidence))

          # Explicit known read handlers should not update the tournament row.
          for n in ['cloudWorkspace','listCloudTournaments','getCloudTournament','getCloudTournamentSnapshot','getArbiterTournament','listOrganizerArbiterResults']:
              b=body(n)
              if not b: continue
              mut=bool(re.search(r'UPDATE\s+cloud_tournaments|INSERT\s+INTO\s+cloud_[A-Za-z0-9_]*revision|\.put\s*\(',b,re.I))
              print(f'READ_HANDLER {n}:TOURNAMENT_MUTATION={"YES" if mut else "NO"}')
          PY
