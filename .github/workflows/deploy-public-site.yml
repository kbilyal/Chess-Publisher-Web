name: Deploy Public Website

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/public-site/**'
      - 'production-web/web/chess-results-browser-adapter.js'
      - '.github/workflows/deploy-public-site.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/public-site/**'
      - '.github/workflows/deploy-public-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('chess-publisher-public-site-pr-{0}', github.event.pull_request.number) || 'chess-publisher-public-site-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_ORIGIN: https://chess-publisher.org
      WORKER_NAME: white-meadow-8069

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Materialize current production site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/assets/screenshots

          files=(
            index.html
            app.js
            styles.css
            release-live.css
            release-live.js
            contact.html
            support.html
            tournaments.html
            tournaments.css
            tournaments.js
            hub-config.js
            rating-analysis.js
            user-manual.html
            manual.css
            manual.js
            latest.json
            tournaments-data.json
            robots.txt
            sitemap.xml
            news-october-2026.html
            assets/chess-publisher-icon.png
            assets/screenshots/chess-results.png
            assets/screenshots/dgt-boards.png
            assets/screenshots/lists-players.png
            assets/screenshots/pairings.png
            assets/screenshots/tournament-schedule.png
            assets/screenshots/tournament-setup.png
          )

          for path in "${files[@]}"; do
            mkdir -p "site/$(dirname "$path")"
            curl --fail --silent --show-error --location \
              --retry 4 --retry-all-errors --connect-timeout 15 --max-time 60 \
              "${PUBLIC_ORIGIN}/${path}?deploy_base=${GITHUB_SHA}" \
              --output "site/${path}"
            test -s "site/${path}"
          done

      - name: Apply WEB Companion v42 homepage patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'data-site-build="2026-09-08-v42-platform-icons"' site/index.html; then
            echo 'Live homepage is already v42; patch application is not required.'
          else
            cd site
            patch --batch --forward -p1 < ../deploy/public-site/index-v40-to-v42.patch
          fi
          cp deploy/public-site/news-web-companion-linux-2026.html site/news-web-companion-linux-2026.html

      - name: Integrate Hub public enhancements
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/public-site/hub-fide-event-id.js site/hub-fide-event-id.js
          cp deploy/public-site/hub-useful-links.js site/hub-useful-links.js
          python - <<'PY'
          from pathlib import Path

          path = Path('site/tournaments.html')
          html = path.read_text(encoding='utf-8')
          markers = [
              '<script src="/hub-fide-event-id.js"></script>',
              '<script src="/hub-useful-links.js"></script>',
          ]
          if '</head>' not in html:
              raise SystemExit('tournaments.html has no </head> insertion point')
          for marker in markers:
              if marker not in html:
                  html = html.replace('</head>', f'  {marker}\n</head>', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Apply calendar-based tournament status correction
        shell: bash
        run: |
          set -euo pipefail
          python deploy/public-site/patch-tournament-calendar-status.py site/tournaments.js
          node --check site/tournaments.js
          node deploy/public-site/test-tournament-calendar-status.cjs site/tournaments.js
          grep -q 'hub-calendar-status-v3' site/tournaments.js
          grep -q 'map(hubApplyCalendarStatus)' site/tournaments.js

      - name: Refresh Hub script URL to prevent cached old status logic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          page = Path('site/tournaments.html')
          html = page.read_text(encoding='utf-8')
          pattern = r'(?P<head><script\b[^>]*\bsrc=["\x27]/?)tournaments\.js(?:\?[^"\x27]*)?(?P<tail>["\x27])'
          html, n = re.subn(pattern, lambda m: m.group('head') + 'tournaments.js?v=20261116-calendar-v3' + m.group('tail'), html, count=1)
          if n != 1:
              raise SystemExit('Unable to update Hub script cache key')
          page.write_text(html, encoding='utf-8')
          PY
          grep -q 'tournaments.js?v=20261116-calendar-v3' site/tournaments.html

      - name: Update sitemap for WEB Companion news
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('site/sitemap.xml')
          text = p.read_text(encoding='utf-8')
          url = 'https://chess-publisher.org/news-web-companion-linux-2026.html'
          if url not in text and '</urlset>' in text:
              block = '  <url>\n    <loc>' + url + '</loc>\n  </url>\n'
              text = text.replace('</urlset>', block + '</urlset>')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Build and test the desktop web workspace
        shell: bash
        env:
          CP_REG_UI_SCREENSHOT: ${{ github.event_name == 'pull_request' && format('{0}/registration-visual-parity.png', runner.temp) || '' }}
        run: |
          set -euo pipefail
          web_app=deploy/public-site/desktop-web
          engine="$RUNNER_TEMP/cp-browser-engine"
          bash deploy/public-site/pairing-preview/build.sh "$engine"
          bash "$web_app/build.sh" site/app "$engine"
          mkdir -p site/pairing-preview
          cat > site/pairing-preview/index.html <<'HTML'
          <!doctype html><html lang="bg"><meta charset="utf-8"><title>ChessPublisher Web</title>
          <meta http-equiv="refresh" content="0;url=/app/"><a href="/app/">ChessPublisher Web</a></html>
          HTML
          python deploy/public-site/add-online-pairings-section.py site/index.html
          npm install --prefix "$RUNNER_TEMP/cp-preview-test" --no-save playwright-core@1.65.1
          python -m http.server 8793 --bind 127.0.0.1 --directory site >"$RUNNER_TEMP/pairing-preview-http.log" 2>&1 &
          http_pid=$!
          trap 'kill "$http_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 6 --retry-connrefused http://127.0.0.1:8793/app/ >/dev/null
          node "$web_app/fide-cache-smoke.mjs" http://127.0.0.1:8793/app/ "$RUNNER_TEMP/cp-preview-test" "$(command -v google-chrome)"
          node "$web_app/pdf-export-smoke.mjs" http://127.0.0.1:8793/app/ "$RUNNER_TEMP/cp-preview-test" "$(command -v google-chrome)"
          node "$web_app/smoke.mjs" http://127.0.0.1:8793/app/ "$RUNNER_TEMP/cp-preview-test" "$(command -v google-chrome)"

      - name: Archive screenshot of compact registration for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: chess-publisher-registration-visual-review
          path: ${{ runner.temp }}/registration-visual-*.png
          if-no-files-found: error
          retention-days: 7

      - name: Remove September Update homepage sections
        shell: bash
        run: python deploy/public-site/remove-september-update.py site/index.html

      - name: Show only stable 1.06.00 downloads
        shell: bash
        run: python deploy/public-site/stable-downloads-only.py site

      - name: Remove BETA badges from the homepage navigation
        shell: bash
        run: python deploy/public-site/remove-home-nav-beta.py site/index.html

      - name: Public-site regression gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-site-build="2026-09-08-v42-platform-icons"' site/index.html
          python deploy/public-site/remove-home-nav-beta.py --check site/index.html
          grep -q 'Open WEB Companion' site/index.html
          grep -q 'data-home-web-entry="protected-v1"' site/index.html
          grep -q 'data-home-web-entry="nav"' site/index.html
          grep -q 'data-home-web-entry="hero"' site/index.html
          grep -q 'data-home-web-entry="footer"' site/index.html
          grep -q 'Chess-Publisher is coming to Linux' site/index.html
          grep -q '<strong>Windows</strong>' site/index.html
          grep -q '<strong>Linux</strong>' site/index.html
          grep -q 'Install it on mobile' site/index.html
          grep -q 'Meet WEB Companion' site/news-web-companion-linux-2026.html
          grep -q 'Linux.*In development' site/news-web-companion-linux-2026.html
          test -s site/tournaments.js
          test -s site/tournaments.html
          grep -q 'tournaments.js?v=20261116-calendar-v3' site/tournaments.html
          test -s site/hub-config.js
          test -s site/hub-fide-event-id.js
          test -s site/hub-useful-links.js
          grep -q 'hub-fide-event-id-v1' site/hub-fide-event-id.js
          grep -q 'hub-useful-links-v1' site/hub-useful-links.js
          grep -q '<script src="/hub-fide-event-id.js"></script>' site/tournaments.html
          grep -q '<script src="/hub-useful-links.js"></script>' site/tournaments.html
          test -s site/assets/screenshots/pairings.png
          node --check site/hub-fide-event-id.js
          node --check site/hub-useful-links.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Gate(HTMLParser):
              pass
          for name in ('index.html', 'news-web-companion-linux-2026.html', 'tournaments.html', 'user-manual.html'):
              parser = Gate()
              parser.feed(Path('site', name).read_text(encoding='utf-8'))
              parser.close()
          print('HTML parse gate: PASS')
          PY

      - name: Check Cloudflare deployment credentials
        id: cf
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [[ -n "${CF_API_TOKEN}" && -n "${CF_ACCOUNT_ID}" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ERROR: Cloudflare deployment credentials are missing; production cannot be updated.'
            exit 1
          fi

      - name: Deploy public website Worker assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name white-meadow-8069 --assets ./site --compatibility-date 2026-09-08

      - name: Verify production v42
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cf.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            cb="${GITHUB_SHA}-${attempt}-$(date +%s)"
            home="$(curl --fail --silent --show-error --location --retry 2 "${PUBLIC_ORIGIN}/?cb=${cb}" || true)"
            news="$(curl --fail --silent --show-error --location --retry 2 "${PUBLIC_ORIGIN}/news-web-companion-linux-2026.html?cb=${cb}" || true)"
            tournaments="$(curl --fail --silent --show-error --location --retry 2 "${PUBLIC_ORIGIN}/tournaments.html?cb=${cb}" || true)"
            fide_badge="$(curl --fail --silent --show-error --location --retry 2 "${PUBLIC_ORIGIN}/hub-fide-event-id.js?cb=${cb}" || true)"
            hub_links="$(curl --fail --silent --show-error --location --retry 2 "${PUBLIC_ORIGIN}/hub-useful-links.js?cb=${cb}" || true)"
            tournament_js="$(curl --fail --silent --show-error --location --retry 2 "${PUBLIC_ORIGIN}/tournaments.js?cb=${cb}" || true)"
            if ! grep -q 'pre-fide-r12.js' <<<"$home" \
              && grep -q '/releases/download/v1.06.00/' <<<"$home" \
              && grep -q 'data-site-build="2026-09-08-v42-platform-icons"' <<<"$home" \
              && python deploy/public-site/remove-home-nav-beta.py --check /dev/stdin <<<"$home" \
              && grep -q 'Chess-Publisher is coming to Linux' <<<"$home" \
              && grep -q 'Meet WEB Companion' <<<"$news" \
              && grep -q '/hub-fide-event-id.js' <<<"$tournaments" \
              && grep -q '/hub-useful-links.js' <<<"$tournaments" \
              && grep -q 'tournaments.js?v=20261116-calendar-v3' <<<"$tournaments" \
              && grep -q 'hub-fide-event-id-v1' <<<"$fide_badge" \
              && grep -q 'hub-useful-links-v1' <<<"$hub_links" \
              && grep -q 'hub-calendar-status-v3' <<<"$tournament_js" \
              && grep -q 'map(hubApplyCalendarStatus)' <<<"$tournament_js"; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1
          echo 'PUBLIC WEBSITE + STABLE 1.06.00 + HUB LIVE GATE: PASS'

      - name: Verify live desktop web workspace
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cf.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          home="$(curl --fail --silent --show-error --retry 3 "$PUBLIC_ORIGIN/?preview_build=$GITHUB_SHA")"
          grep -q 'data-desktop-web="nav" href="/app/"' <<<"$home"
          grep -q 'id="chesspublisher-web"' <<<"$home"
          grep -q 'data-desktop-web="section" href="/app/"' <<<"$home"
          for attempt in 1 2 3; do
            if node deploy/public-site/desktop-web/smoke.mjs "$PUBLIC_ORIGIN/app/?build=$GITHUB_SHA-$attempt" "$RUNNER_TEMP/cp-preview-test" "$(command -v google-chrome)"; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
          done
          exit 1
