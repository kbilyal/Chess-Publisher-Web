name: Validate Cloud Sync Lineage Worker

on:
  push:
    branches:
      - fix/unified-sync-phantom-conflict
    paths:
      - 'scripts/patch-cloud-sync-lineage-worker.py'
      - '.github/workflows/validate-cloud-sync-lineage-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  HUB_WORKER_NAME: chess-publisher-hub-api-beta
  EXPECTED_BASELINE_SHA256: 28c5a5fcb3d1ac78976d5affa946c1255368b01fe88ef4b33ab023ca1168d1df

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate patch syntax
        run: python -m py_compile scripts/patch-cloud-sync-lineage-worker.py
      - name: Recover exact live Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          work="$RUNNER_TEMP/cloud-sync-lineage"
          mkdir -p "$work"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${HUB_WORKER_NAME}"
          curl --fail --silent --show-error --location -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" -o "$work/live.multipart"
          python - <<'PY'
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          import hashlib, os
          work=Path(os.environ['RUNNER_TEMP'])/'cloud-sync-lineage'
          raw=(work/'live.multipart').read_bytes()
          boundary=raw.splitlines()[0].decode('ascii','strict')[2:]
          envelope=(f'Content-Type: multipart/form-data; boundary={boundary}\r\nMIME-Version: 1.0\r\n\r\n').encode()+raw
          msg=BytesParser(policy=default).parsebytes(envelope)
          parts=list(msg.iter_parts())
          if len(parts)!=1: raise SystemExit(f'Unexpected live module count: {len(parts)}')
          payload=parts[0].get_payload(decode=True) or b''
          src=payload.decode('utf-8','strict')
          sha=hashlib.sha256(payload).hexdigest()
          expected=os.environ['EXPECTED_BASELINE_SHA256']
          if 'private_cloud_sync_lineage_v1' not in src and sha != expected:
              raise SystemExit(f'Live Worker drifted before validation: {sha}')
          for marker in ['private_cloud_hard_delete_v1','arbiter_access_v1','arbiter_special_results_v1']:
              if marker not in src: raise SystemExit(f'Missing required live marker: {marker}')
          (work/'worker.js').write_bytes(payload)
          print('LIVE_BASELINE_SHA256='+sha)
          PY
      - name: Apply patch to live source copy
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cloud-sync-lineage"
          python scripts/patch-cloud-sync-lineage-worker.py "$work/worker.js"
          node --check "$work/worker.js"
          python - <<'PY'
          from pathlib import Path
          import hashlib, os
          p=Path(os.environ['RUNNER_TEMP'])/'cloud-sync-lineage'/'worker.js'
          src=p.read_text(encoding='utf-8')
          required=[
            'private_cloud_sync_lineage_v1',
            'cloudSyncSnapshotContentFingerprint',
            'contentFingerprint',
            'cloudTournamentId: row.id',
            'internalId: String(row.local_key || "")',
            'reason, source_revision',
            "'arbiter-result'",
            'board.result = resultValue',
            'revision = currentRevision + 1'
          ]
          for marker in required:
              if marker not in src: raise SystemExit(f'Patched Worker missing: {marker}')
          print('PATCHED_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          print('CLOUD_SYNC_LINEAGE_WORKER_VALIDATION=PASS')
          PY
