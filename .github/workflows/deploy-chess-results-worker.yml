name: Deploy Chess-Results Worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/chess-results/**'
      - 'production-web/web/chess-results-browser-adapter.js'
      - '.github/workflows/deploy-chess-results-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Worker syntax
        run: node --check workers/chess-results/worker.js

      - name: Chess-Results Worker protocol/security regression
        run: node workers/chess-results/worker.test.mjs

      - name: Verify browser boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"/api/chess-results/"' production-web/web/chess-results-browser-adapter.js
          grep -q 'Authorization' production-web/web/chess-results-browser-adapter.js
          grep -q 'organizer-primary' production-web/web/chess-results-browser-adapter.js
          ! grep -Eq 'AES_KEY|AES_IV|CreatorID 100|7695CF0579445A78A642DCA0316407FF' production-web/web/chess-results-browser-adapter.js

      - name: Check Cloudflare deployment credentials
        id: cf
        shell: bash
        run: |
          if [[ -n "${CF_API_TOKEN}" && -n "${CF_ACCOUNT_ID}" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.'
          fi

      - name: Deploy Worker route
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/chess-results
          command: deploy
