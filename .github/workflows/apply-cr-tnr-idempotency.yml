name: Apply Chess-Results TNR Idempotency Repair

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-cr-tnr-idempotency.cjs'
      - '.github/workflows/apply-cr-tnr-idempotency.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: node scripts/repair-cr-tnr-idempotency.cjs

      - run: npm ci

      - name: Targeted regression gates
        run: |
          npm run lint
          npm run test:chess-results-companion
          npm run test:chess-results
          npm run test:cloud-roundtrip
          npm run test:trf

      - name: Commit repaired production code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/companion/CompanionWorkspace.tsx src/cloud/tests/runCompanionChessResultsTransportTests.ts
          git diff --cached --quiet && exit 0
          git commit -m "Make Chess-Results TNR rollover idempotent"
          git push origin HEAD:main
