name: Cloud Workspace Integration Gate

on:
  push:
    branches:
      - main
      - integration/cloud-workspace-2026-09-03
      - prep/cloud-browser-autosync-beta5
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloud-workspace-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Online & Cloud beta4 regression
        run: npm run test:online-cloud

      - name: Online & Cloud beta5 Browser Continuation regression
        run: npm run test:online-cloud-beta5

      - name: Desktop-Web Cloud roundtrip regression
        run: npm run test:cloud-roundtrip

      - name: Production Web beta7 regression
        run: npm run test:production-web-beta7

      - name: Recovered browser function regression
        run: npm run test:recovered-web-functions

      - name: Chess-Results browser and server transport regression
        run: npm run test:chess-results

      - name: Transaction regression
        run: npm run test:transactions

      - name: Round finalization regression
        run: npm run test:finalization

      - name: FIDE regression
        run: npm run test:fide

      - name: Production build
        run: npm run build

      - name: Verify Online & Cloud integration markers
        shell: bash
        run: |
          set -euo pipefail
          test -f src/cloud/cloudWorkspaceApi.ts
          test -f src/cloud/onlineCloudSync.ts
          test -f src/cloud/CloudSyncCoordinator.ts
          test -f src/cloud/browserSyncPolicy.ts
          test -f src/cloud/OnlineCloudProviderV2.tsx
          test -f src/cloud/OnlineCloudTabV2.tsx
          test -f src/cloud/tests/runOnlineCloudBeta5BrowserTests.ts
          test -f src/cloud/tests/runCloudRoundtripTests.ts
          test -f cloudrun.ts
          grep -q "OnlineCloudProvider" src/main.tsx
          grep -q "classifyThreeWay" src/cloud/onlineCloudSync.ts
          grep -q "X-Expected-Revision" src/cloud/cloudWorkspaceApi.ts
          grep -q "Automatic Cloud Sync" src/cloud/OnlineCloudTabV2.tsx
          grep -q "Pull Changes" src/cloud/OnlineCloudProviderV2.tsx
          grep -q "cloudTournamentId" src/cloud/browserSyncPolicy.ts
          grep -q "process.env.PORT" cloudrun.ts
          if grep -R -n -E 'B2_APPLICATION_KEY|B2_KEY_ID|HUB_BETA_CREATE_KEY' src/cloud; then
            echo 'Infrastructure secret identifier found in browser cloud integration.' >&2
            exit 1
          fi

      - name: Archive build metadata
        if: always()
        run: |
          git rev-parse HEAD
          node --version
          npm --version
